<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>Shift Board — Holiday &amp; Clock-In</title>
<meta name="theme-color" content="#0b0b0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shift Board">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c;
    --panel:#151516;
    --panel-2:#1e1e1f;
    --line:#333335;
    --line-soft:#2a2a2c;
    --amber:#e2222d;
    --amber-dim:#4a1216;
    --green:#5fb98a;
    --green-dim:#1f3a2c;
    --red:#ff5b52;
    --red-dim:#3d1614;
    --text:#f7f7f8;
    --muted:#b4b6b8;
    --muted-2:#7d7f82;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.01em;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- top strip ---------- */
  .topstrip{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;
    border-bottom:3px solid var(--amber);
    background:var(--panel);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-logo{height:36px;width:auto;display:block;}
  .brand-sub{color:var(--muted);font-size:13px;border-left:1px solid var(--line);padding-left:14px;}
  .clock-readout{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:14px;text-align:right;}
  .clock-readout b{color:var(--text);font-size:16px;}

  /* ---------- kiosk home ---------- */
  .kiosk-home{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 20px;gap:34px;
  }
  .kiosk-actions{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;max-width:1040px;}
  .kiosk-btn{
    width:300px;max-width:88vw;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 22px;
    text-align:left;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .kiosk-btn:active{transform:scale(.98);}
  .kiosk-btn:hover{border-color:var(--amber);}
  .kiosk-btn .icon{
    width:38px;height:38px;border-left:3px solid var(--amber);padding-left:10px;
    display:flex;align-items:center;margin-bottom:16px;
  }
  .kiosk-btn h2{font-size:22px;color:var(--text);}
  .kiosk-btn p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.4;}
  .admin-link{
    color:var(--muted-2);font-size:13px;text-decoration:none;cursor:pointer;
    border:1px solid var(--line-soft);padding:8px 14px;border-radius:var(--radius);
  }
  .admin-link:hover{color:var(--muted);border-color:var(--line);}

  /* ---------- flow screens (pin / clock / holiday) ---------- */
  .flow{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;}
  .flow-card{width:380px;max-width:92vw;text-align:center;}
  .flow-card h2{font-size:24px;margin-bottom:6px;}
  .flow-card .sub{color:var(--muted);font-size:14px;margin-bottom:26px;}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:28px;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);}
  .pin-dot.filled{background:var(--amber);border-color:var(--amber);}
  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:280px;max-width:80vw;margin:0 auto;}
  .pinpad button{
    height:64px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:22px;font-family:'IBM Plex Mono',monospace;
    cursor:pointer;
  }
  .pinpad button:active{background:var(--line);}
  .pinpad .pp-clear{font-family:'Inter',sans-serif;font-size:13px;color:var(--muted);}
  .pinpad .pp-back{font-size:18px;}
  .back-link{margin-top:26px;color:var(--muted-2);font-size:13px;cursor:pointer;}
  .back-link:hover{color:var(--muted);}
  .error-msg{color:var(--red);font-size:13px;margin-top:14px;min-height:18px;}

  /* ---------- confirmation / status ---------- */
  .status-badge{
    display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;
    font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;
  }
  .status-in{background:var(--green-dim);color:var(--green);}
  .status-out{background:var(--panel-2);color:var(--muted);}
  .big-check{
    width:64px;height:64px;border-radius:50%;background:var(--green-dim);color:var(--green);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px;
  }
  .action-btn{
    width:100%;padding:16px;border-radius:var(--radius);border:1px solid var(--amber);
    background:var(--amber);color:#ffffff;font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;
    cursor:pointer;margin-top:20px;
  }
  .action-btn:active{opacity:.85;}
  .action-btn.secondary{background:transparent;color:var(--text);border-color:var(--line);}
  .action-btn.danger{background:#000;border-color:var(--amber);color:#ffffff;}
  .action-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- holiday request form ---------- */
  .field{text-align:left;margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:none;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-size:16px;font-family:inherit;
  }
  .allowance-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:18px;}
  .allowance-line b{color:var(--text);}
  .req-summary{
    background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;text-align:left;font-size:13px;color:var(--muted);margin-top:16px;
  }
  .req-summary b{color:var(--text);display:block;font-size:15px;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .req-summary .excl{color:var(--muted-2);font-size:12px;margin-top:6px;}

  /* ---------- admin shell ---------- */
  .admin-shell{flex:1;display:flex;}
  .admin-nav{
    width:190px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    padding:18px 0;
  }
  .admin-nav .nav-item{
    padding:12px 20px;color:var(--muted);font-size:14px;cursor:pointer;border-left:3px solid transparent;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .admin-nav .nav-item:hover{color:var(--text);}
  .admin-nav .nav-item.active{color:var(--text);border-left-color:var(--amber);background:var(--panel-2);}
  .request-badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:12px;background:var(--amber);color:#fff;font-size:11px;font-weight:800;}
  .admin-main{flex:1;padding:26px 30px;overflow-x:auto;}
  .admin-main h2{font-size:22px;margin-bottom:4px;}
  .admin-main .head-sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .admin-topbar{display:flex;justify-content:space-between;align-items:flex-start;}
  .exit-link{color:var(--muted-2);font-size:13px;cursor:pointer;}
  .exit-link:hover{color:var(--muted);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line-soft);}
  tr:last-child td{border-bottom:none;}
  .pill{padding:3px 9px;border-radius:20px;font-size:11px;font-family:'IBM Plex Mono',monospace;}
  .pill-pending{background:var(--amber-dim);color:var(--amber);}
  .pill-approved{background:var(--green-dim);color:var(--green);}
  .pill-rejected{background:var(--red-dim);color:var(--red);}
  .btn-sm{
    padding:6px 12px;border-radius:var(--radius);font-size:12px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);cursor:pointer;margin-right:6px;
  }
  .btn-sm.approve{border-color:var(--green);color:var(--green);}
  .btn-sm.reject{border-color:var(--red);color:var(--red);}
  .btn-sm:hover{background:var(--line-soft);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;overflow-x:auto;}
  .conflict-box{background:var(--red-dim);border:1px solid var(--red);border-radius:var(--radius);padding:10px 12px;font-size:12px;color:var(--red);margin-top:8px;}
  .empty-state{color:var(--muted-2);font-size:13px;padding:20px 0;}

  .form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .form-row .field{margin-bottom:0;min-width:150px;flex:1;}
  .add-btn{
    padding:12px 18px;border-radius:var(--radius);border:1px solid var(--amber);background:transparent;
    color:var(--amber);font-size:13px;cursor:pointer;white-space:nowrap;
  }
  .add-btn:hover{background:var(--amber-dim);}
  .icon-btn{background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:13px;}
  .icon-btn:hover{color:var(--red);}
  .toggle{cursor:pointer;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);}
  .toggle.on{border-color:var(--green);color:var(--green);}
  .toggle.off{border-color:var(--muted-2);color:var(--muted-2);}

  /* calendar */
  .cal-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .cal-toolbar button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:var(--radius);padding:8px 12px;cursor:pointer;font-size:14px;}
  .cal-toolbar select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:var(--radius);padding:8px 12px;font-size:15px;}
  .cal-month-label{font-family:'Oswald',sans-serif;font-size:17px;min-width:150px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);}
  .cal-dow{background:var(--panel);color:var(--muted-2);font-size:11px;text-transform:uppercase;padding:6px;text-align:center;}
  .cal-cell{background:var(--panel);min-height:88px;padding:6px;position:relative;}
  .cal-cell.other-month{background:var(--bg);opacity:.4;}
  .cal-cell.sunday{background:#201d1d;}
  .cal-cell.saturday{background:#211f1a;}
  .cal-cell.bh::after{content:'BH';position:absolute;top:6px;right:6px;font-size:9px;color:var(--red);font-family:'IBM Plex Mono',monospace;}
  .cal-date{font-size:12px;color:var(--text);font-family:'IBM Plex Mono',monospace;position:relative;z-index:4;display:inline-block;}
  .cal-count{
    position:absolute;bottom:6px;right:6px;font-size:10px;font-family:'IBM Plex Mono',monospace;
    padding:1px 6px;border-radius:10px;background:var(--panel-2);color:var(--muted);
  }
  .cal-count.full{background:var(--red-dim);color:var(--red);}
  .cal-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
  .cal-chip{
    font-size:9px;color:#fff;padding:2px 5px;border-radius:3px;
    font-family:'IBM Plex Mono',monospace;font-weight:600;
    border:1px solid rgba(255,255,255,.16);white-space:nowrap;
  }
  .site-colour-legend{display:flex;gap:8px 14px;flex-wrap:wrap;margin:10px 0 14px;font-size:11px;color:var(--muted);}
  .site-colour-legend span{display:inline-flex;align-items:center;gap:6px;}
  .site-colour-dot{width:10px;height:10px;border-radius:2px;display:inline-block;flex:0 0 auto;}
  .legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;display:inline-block;border-radius:2px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:12px 20px;border-radius:var(--radius);font-size:13px;z-index:50;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .toast.err{border-color:var(--red);color:var(--red);}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:flex;align-items:flex-start;justify-content:center;
    z-index:40;padding:20px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;width:380px;max-width:100%;
    max-height:calc(100vh - 40px);
    overflow-y:auto;
    overscroll-behavior:contain;
    margin:auto 0;
  }
  .modal h3{margin-bottom:14px;font-size:17px;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .action-btn{margin-top:0;}

  .ts-site-card{overflow-x:auto;}
  .ts-site-title{font-size:15px;color:var(--amber);margin-bottom:12px;font-family:'Oswald',sans-serif;}
  /* ---- attendance sheet (matches paper form) ---- */
  .att-sheet{background:#fff;color:#000;border:1px solid #000;margin-bottom:22px;font-family:'Inter',sans-serif;}
  .att-title-row{padding:10px 14px;text-align:center;font-weight:700;font-size:16px;border-bottom:1px solid #000;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:14px;}
  .att-logo{height:44px;width:auto;}
  .att-meta-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #000;font-weight:700;font-size:13px;}
  .att-meta-row span.site-tag{font-weight:700;}
  .att-table{width:100%;border-collapse:collapse;font-size:12px;}
  .att-table-wrap{overflow-x:auto;}
  .att-table{min-width:680px;}
  .att-table th,.att-table td{border:1px solid #000;padding:6px 8px;text-align:center;color:#000;}
  .att-table thead tr:first-child th{background:#f2f2f2;font-weight:700;}
  .att-table thead tr:last-child th{background:#f2f2f2;font-weight:700;text-transform:uppercase;}
  .att-table td.att-name{text-align:left;font-weight:700;white-space:nowrap;}
  .att-table td.att-empty-row td{height:24px;}
  .att-hol{font-style:italic;color:#555;}
  .att-pending-hol{display:inline-block;margin-left:3px;color:#b36b00;font-weight:700;font-style:normal;}
  .abs-select{width:100%;border:1px solid #ccc;background:#fff;color:#000;font-family:inherit;font-size:11px;padding:2px;border-radius:2px;}
  .hrs-input{width:100%;border:1px solid #bbb;background:#fff;color:#000;font-family:inherit;font-size:12px;text-align:center;padding:3px;border-radius:2px;}
  .hrs-input::placeholder{color:#bbb;}
  .hrs-input.hrs-overridden{background:#ffd875;border-color:#c98a00;font-weight:600;}
  .hrs-input.hrs-unexpected{border-color:#b3261e;border-width:2px;}
  .hrs-input.hrs-estimated{background:#e8e0ff;border-color:#6b4fc9;border-style:dashed;}
  .hrs-input:focus{outline:1px solid #000;}
  .att-table,.att-sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .abs-select.abs-sick{color:#a15c00;}
  .abs-select.abs-authorised{color:#1a5da1;}
  .abs-select.abs-unauthorised{color:#b3261e;}
  .pill-sick{background:#4a3616;color:#e8a94a;}
  .pill-authorised{background:#16324a;color:#5aa3e8;}
  .pill-unauthorised{background:var(--red-dim);color:var(--red);}
  .reg-abs-actions{display:flex;gap:4px;margin-top:4px;}
  .reg-abs-btn{
    font-size:12px;padding:6px 11px;border-radius:4px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    cursor:pointer;margin:3px 4px 0 0;font-weight:500;
  }
  .reg-abs-btn:hover{background:var(--line-soft);border-color:var(--muted);}
  /* Clock actions are the ones managers reach for most, so mark them out. */
  .reg-abs-btn.act-clock{border-color:var(--green);color:var(--green);}
  .reg-abs-btn.act-clock:hover{background:var(--green-dim);}
  .reg-abs-actions{display:flex;flex-wrap:wrap;gap:0;margin-top:6px;}
  .att-table input{width:48px;border:none;background:transparent;text-align:center;font-family:inherit;font-size:12px;color:#000;padding:2px;}
  .att-table input:focus{outline:1px solid #000;background:#fffbcc;}
  .att-other-info{border-top:1px solid #000;}
  .att-other-info td{border:1px solid #000;padding:8px;}
  .att-other-info label{font-weight:700;font-size:12px;display:block;margin-bottom:4px;}
  .att-other-info textarea{width:100%;border:1px solid #ccc;font-family:inherit;font-size:12px;padding:6px;background:#fff;color:#000;min-height:34px;resize:vertical;}
  .att-footnote{padding:8px 14px;font-size:11px;font-weight:700;border-top:1px solid #000;}
  .mot-print-source{position:fixed;left:-200vw;top:0;width:1100px;background:#fff;color:#000;}
  @media print{
    body{background:#fff;color:#000;}
    .topstrip,.admin-nav,.admin-topbar,.cal-toolbar{display:none !important;}
    .admin-shell{display:block;}
    .admin-main{padding:0;}
    h2,.head-sub{display:none !important;}
    .att-sheet:not(:last-of-type){page-break-after:always;}
  }
  @media (max-width:720px){
    .admin-shell{flex-direction:column;}
    .admin-nav{width:100%;display:flex;overflow-x:auto;padding:8px;border-right:none;border-bottom:1px solid var(--line);}
    .admin-nav .nav-item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:12px 16px;}
    .admin-nav .nav-item.active{border-left:none;border-bottom-color:var(--amber);}
    .admin-main{padding:16px;}
  }
  @media (max-width:480px){
    .topstrip{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 16px;}
    .clock-readout{text-align:left;}
    .brand-logo{height:30px;}
    .kiosk-home{padding:24px 14px;gap:24px;}
    .kiosk-btn{padding:22px 18px;}
    .flow-card{width:100%;}
    .pinpad{width:250px;}
    .pinpad button{height:56px;font-size:20px;}
  }

  @media (max-height:700px){
    .modal-overlay{padding:10px;}
    .modal{
      max-height:calc(100vh - 20px);
      padding:16px 18px;
      margin:0;
    }
    .modal .field{margin-bottom:12px;}
    .modal-actions{position:sticky;bottom:0;background:var(--panel);padding-top:10px;}
  }


  .cal-add-btn{
    position:absolute;top:5px;right:5px;width:20px;height:20px;padding:0;
    border:1px solid var(--line);border-radius:3px;background:var(--panel-2);
    color:var(--muted);font-size:14px;line-height:18px;cursor:pointer;z-index:3;
    opacity:0;transition:opacity .12s ease;
  }
  .cal-cell:hover .cal-add-btn, .cal-add-btn:focus{opacity:1;}
  @media (hover:none){ .cal-add-btn{opacity:.55;} }
  .cal-cell.bh .cal-add-btn{top:20px;}
  .cal-add-btn:hover{border-color:var(--amber);color:var(--text);}
  .cal-chip.cal-editable{cursor:pointer;border:1px solid rgba(255,255,255,.18);}
  .cal-chip.cal-editable:hover{outline:2px solid rgba(255,255,255,.35);}


  .cal-cell.today{
    outline:3px solid var(--amber);
    outline-offset:-3px;
    background:rgba(255,193,7,.10);
    box-shadow:inset 0 0 0 1px rgba(255,193,7,.35);
  }
  .cal-cell.today .cal-date{
    background:var(--amber);
    color:#111;
    border-radius:999px;
    min-width:26px;
    height:26px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
  }


  .vault-grid{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:10px;align-items:end;}
  .vault-row{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .vault-secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;}
  .vault-actions{display:flex;gap:6px;flex-wrap:wrap;}
  @media(max-width:850px){
    .vault-grid,.vault-row{grid-template-columns:1fr;}
  }


  .att-sheet input:disabled,.att-sheet select:disabled,.att-sheet textarea:disabled{
    opacity:1;
    color:#222;
    background:#f1f1f1;
    cursor:not-allowed;
  }

  /* A single, deliberate startup screen prevents the device-setup view from
     flashing while the site list and saved data are still arriving. */
  .startup-screen{
    min-height:100vh;
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:32px 22px;
    background:
      radial-gradient(circle at 50% 38%,rgba(226,34,45,.12),transparent 38%),
      var(--bg);
  }
  .startup-card{width:min(360px,92vw);text-align:center;}
  .startup-logo{display:block;width:min(270px,76vw);height:auto;margin:0 auto 30px;}
  .startup-rule{width:54px;height:3px;background:var(--amber);margin:0 auto 18px;border-radius:3px;}
  .startup-title{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;letter-spacing:.02em;}
  .startup-copy{margin-top:8px;color:var(--muted);font-size:13px;}
  .startup-progress{
    width:150px;height:3px;margin:26px auto 0;border-radius:3px;
    background:var(--line-soft);overflow:hidden;
  }
  .startup-progress::after{
    content:'';display:block;width:46%;height:100%;background:var(--amber);
    border-radius:inherit;animation:startup-slide 1.05s ease-in-out infinite;
  }
  @keyframes startup-slide{
    0%{transform:translateX(-110%);}
    50%{transform:translateX(115%);}
    100%{transform:translateX(330%);}
  }
  @media (prefers-reduced-motion:reduce){
    .startup-progress::after{animation:none;width:100%;opacity:.75;}
  }

</style>

  await prompt.prompt();
  try{ await prompt.userChoice; }catch(_e){}

}

const SUPABASE_URL = 'https://disgpocvqitpeceqhuim.supabase.co';

/* ---- Manager sessions ----------------------------------------------
   Managers sign in with email + password. Their token is what unlocks the
   data; the publishable key alone can no longer read anything, so viewing
   the page source gets an attacker nothing. Sessions expire after an hour
   of inactivity. */
const SESSION_KEY = 'shiftboard_session_v1';
const IDLE_LIMIT_MS = 60 * 60 * 1000; // 1 hour

let _session = null; // { access_token, refresh_token, expires_at, role, siteId, name, email, lastActive }

function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.access_token) return null;
    if(Date.now() - (s.lastActive||0) > IDLE_LIMIT_MS) { clearSession(); return null; }
    return s;
  }catch(e){ return null; }
}
function saveSession(s){
  _session = s;
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){}
}
function clearSession(){
  _session = null;
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}
function touchSession(){
  if(!_session) return;
  _session.lastActive = Date.now();
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(_session)); }catch(e){}
}
function sessionExpired(){
  return !!_session && (Date.now() - (_session.lastActive||0) > IDLE_LIMIT_MS);
}

/* Decodes the role/site the server stamped on the token. Read-only here —
   changing it locally achieves nothing, the database checks the real token. */
function decodeToken(token){
  try{
    const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    const meta = payload.app_metadata || {};
    return {
      role: meta.role || null,
      siteId: meta.siteId || null,
      email: payload.email || '',
      mustChangePassword: !!meta.mustChangePassword
    };
  }catch(e){ return { role:null, siteId:null, email:'' }; }
}

async function signInManager(email, password){
  const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    throw new Error(data.error_description || data.msg || data.message || 'Email or password not recognised');
  }
  const info = decodeToken(data.access_token);
  if(info.role !== 'super' && info.role !== 'site'){
    throw new Error('This account has no manager access. Ask upper management to set it up.');
  }
  saveSession({
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + ((data.expires_in||3600)*1000),
    role: info.role,
    siteId: info.siteId,
    email: info.email || email,
    name: (data.user && data.user.user_metadata && data.user.user_metadata.name) || '',
    mustChangePassword: info.mustChangePassword,
    lastActive: Date.now()
  });
  return _session;
}

/* Access tokens are short-lived; swap the refresh token for a new one. */
async function refreshSession(){
  if(!_session || !_session.refresh_token) return false;
  try{
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token: _session.refresh_token })
    });
    if(!res.ok) return false;
    const data = await res.json();
    const info = decodeToken(data.access_token);
    saveSession(Object.assign({}, _session, {
      access_token: data.access_token,
      refresh_token: data.refresh_token || _session.refresh_token,
      expires_at: Date.now() + ((data.expires_in||3600)*1000),
      role: info.role, siteId: info.siteId
    }));
    return true;
  }catch(e){ return false; }
}

async function authHeaders(){
  if(_session && Date.now() > (_session.expires_at - 60000)) await refreshSession();
  const token = _session ? _session.access_token : SUPABASE_KEY;
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json'
  };
}

/* Calls one of the locked-down database functions the kiosk is allowed to
   use. These take a PIN and only ever act on that one person. */
/* Talks to the manage-users Edge Function. The caller's own token goes with
   the request; the function refuses anyone who isn't upper management. */
async function callManageUsers(payload){
  if(!_session) throw new Error('Not signed in');
  const res = await fetch(SUPABASE_URL + '/functions/v1/manage-users', {
    method:'POST',
    headers: await authHeaders(),
    body: JSON.stringify(payload)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || data.message || ('request failed ('+res.status+')'));
  return data;
}

/* Takes one small still from the tablet camera at clock-in. Deliberately
   low resolution — it only needs to show who was stood there, and it is
   deleted when the timesheet week is locked. */
async function captureClockPhoto(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
  let stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:640} }, audio:false });
    const video = document.createElement('video');
    video.playsInline = true; video.muted = true; video.srcObject = stream;
    await video.play();
    // Give the camera a moment to expose properly, or the first frame is black.
    await new Promise(r=>setTimeout(r, 600));
    const w = 320;
    const h = Math.round((video.videoHeight || 480) * (w / (video.videoWidth || 640)));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', 0.5);
  }catch(err){
    console.warn('Clock photo not taken:', err);
    return null;   // never block clocking in because the camera failed
  }finally{
    if(stream) stream.getTracks().forEach(t=>t.stop());
  }
}

async function callRpc(fn, args){
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(args||{})
  });
  if(!res.ok){
    let d=''; try{ d = (await res.json()).message || ''; }catch(_e){}
    throw new Error(d || ('request failed ('+res.status+')'));
  }
  return await res.json();
}
let _lastKnownBin = null;

async function jsonbinRead(){
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/manager_shiftboard_read', {
    method:'POST',
    headers: await authHeaders(),
    body:'{}'
  });
  if(!res.ok){
    let detail = '';
    try{ detail = (await res.json()).message || ''; }catch(_e){}
    throw new Error('read failed ('+res.status+')'+(detail?': '+detail:''));
  }
  const record = await res.json();
  if(!record || typeof record!=='object' || Array.isArray(record)) throw new Error('invalid server response');
  _lastKnownBin = record;
  return record;
}
async function jsonbinWriteKey(key,value){
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/manager_shiftboard_write', {
    method:'POST',
    headers: await authHeaders(),
    body:JSON.stringify({p_key:key,p_value:value})
  });
  if(!res.ok){
    let detail=''; try{ detail=(await res.json()).message||''; }catch(_e){}
    throw new Error('write failed ('+res.status+')'+(detail?': '+detail:''));
  }
  return true;
}
async function jsonbinWrite(fullRecord){
  const keys=Object.keys(fullRecord||{});
  for(const key of keys) await jsonbinWriteKey(key,fullRecord[key]);
  _lastKnownBin = fullRecord;
  return true;
}

function readPendingChanges(){
  try{
    const raw=localStorage.getItem(LOCAL_PENDING_PATCH_KEY);
    const parsed=raw?JSON.parse(raw):{};
    return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:{};
  }catch(_e){ return {}; }
}
function writePendingChanges(changes){
  try{
    if(changes&&Object.keys(changes).length) localStorage.setItem(LOCAL_PENDING_PATCH_KEY,JSON.stringify(changes));
    else localStorage.removeItem(LOCAL_PENDING_PATCH_KEY);
    return true;
  }catch(_e){ return false; }
}
function retireLegacyPendingRecord(){
  try{
    const legacy=localStorage.getItem(LOCAL_PENDING_KEY);
    if(legacy) localStorage.setItem('shiftboard_legacy_pending_backup_v3',legacy);
    localStorage.removeItem(LOCAL_PENDING_KEY);
  }catch(_e){}
}
function writeLocalRecord(record){
  try{
    localStorage.setItem(LOCAL_RECORD_KEY, JSON.stringify(record));
    return true;
  }catch(_e){ return false; }
}
async function trySyncPending(){
  retireLegacyPendingRecord();
  const pending=readPendingChanges(), keys=Object.keys(pending);
  if(!keys.length) return true;
  let allOk=true, record=readLocalRecord()||_lastKnownBin||{};
  for(const key of keys){
    try{
      await jsonbinWriteKey(key,pending[key]);
      record[key]=pending[key]; delete pending[key]; writePendingChanges(pending);
    }catch(_e){ allOk=false; }
  }
  _lastKnownBin=record; writeLocalRecord(record);
  return allOk;
}

async function storageGet(key, fallback){
  // If a previous save was made while offline, try to push it first so a stale
  // cloud copy cannot overwrite the newer local data.
  await trySyncPending();
  try{
    const record = await jsonbinRead();
    const pending=readPendingChanges();
    const merged=Object.assign({},record,pending);
    writeLocalRecord(merged);
    if(merged[key] === undefined || merged[key] === null) return fallback;
    return merged[key];
  }catch(e){
    console.error('Shift Board load failed:', e);
    const local = Object.assign({},readLocalRecord()||{},readPendingChanges());
    if(local && local[key] !== undefined && local[key] !== null) return local[key];
    if(_lastKnownBin && _lastKnownBin[key] !== undefined) return _lastKnownBin[key];
    return fallback;
  }
}
async function storageSet(key, value){
  let record = readLocalRecord() || _lastKnownBin || {};
  record[key] = value;
  _lastKnownBin = record;
  const pending=readPendingChanges(); pending[key]=value;
  const localOk = writeLocalRecord(record) && writePendingChanges(pending);
  if(!localOk){
    showToast('Could not save on this device — browser storage is blocked.', true);
    return false;
  }
  try{
    await jsonbinWriteKey(key,value);
    const remaining=readPendingChanges(); delete remaining[key]; writePendingChanges(remaining);
    return true;
  }catch(e){
    console.error('Shift Board online sync failed:', e);
    showToast('Saved on this device. Online sync is unavailable; it will retry later.', true);
    return true;
  }
}

function timesheetEmployeeCompare(siteId,a,b){
  const order = TIMESHEET_EMPLOYEE_ORDER[siteId] || [];
  const key = emp => String((emp && emp.name) || '').trim().toUpperCase();
  const ak = key(a), bk = key(b);
  const ai = order.indexOf(ak), bi = order.indexOf(bk);
  if(ai !== -1 || bi !== -1){
    if(ai === -1) return 1;
    if(bi === -1) return -1;
    if(ai !== bi) return ai - bi;
  }
  return ak.localeCompare(bk);
}

/* Payroll is recorded in quarter-hours. Keep every calculated or manually
   entered timesheet figure on a 0.25-hour boundary and display it with two
   decimal places (for example 7.50, 7.75 or 8.00). */
function roundTimesheetHours(value){
  const n = Number(value);
  if(!Number.isFinite(n)) return 0;
  return Math.max(0, Math.round((n + Number.EPSILON) * 4) / 4);
}
function roundFillingStationHours(value){
  const n = Number(value);
  if(!Number.isFinite(n)) return 0;
  // After the station timestamps have been rounded, payroll uses only fully
  // completed quarter-hours: 8h55 becomes 8h45 / 8.75 hours.
  return Math.max(0, Math.floor((n + Number.EPSILON) * 4) / 4);
}
function normaliseTimesheetHours(value, emp, siteId){
  const effectiveSiteId = (emp && emp.siteId) || siteId;
  return isFillingStationSite(effectiveSiteId) ? roundFillingStationHours(value) : roundTimesheetHours(value);
}
function formatTimesheetHours(value, emp, siteId){
  return normaliseTimesheetHours(value, emp, siteId).toFixed(2);
}

/* Computes the same figures the Timesheets tab displays, for one week, so
   they can be exported to CSV before the underlying clock events are cleared.
   Mirrors the on-screen logic: clamping, lunch deduction, holiday marking,
   manual overrides and auto-closed shifts. */
function timesheetRowsForWeek(weekIso){
  const weekStart = fromIso(weekIso);
  const days = Array.from({length:7},(_,i)=>{ const d=new Date(weekStart); d.setDate(d.getDate()+i); return d; });
  const shiftsMap = computeAllShifts();
  const extras = getWeekExtras(weekIso);
  const lock = extras.lock && extras.lock.locked ? 'LOCKED' : '';
  const out = [];
  state.config.sites.forEach(site=>{
    const sevenDay = isSevenDaySite(site.id);
    const weekDateSet = new Set(days.map(d=>iso(d)));
    // Same rule as the on-screen sheet: a site's own staff, all their hours.
    state.config.employees
      .filter(e=>e.siteId===site.id)
      .sort((a,b)=>timesheetEmployeeCompare(site.id,a,b)).forEach(emp=>{
      const empData = shiftsMap[emp.id] || {shifts:[]};
      const isVisitor = false;
      const holDates = approvedDatesForEmployee(emp.id);
      const empExtras = (extras.employees||{})[emp.id] || {};
      const hoursOverride = empExtras.hoursOverride || {};
      let weekTotal = 0, satHours = 0, holCount = 0, anyActivity = false;
      const dayVals = days.map((d,i)=>{
        const dateStr = iso(d);
        const dow = d.getDay();
        const isHol = holDates.has(dateStr) && !isVisitor;
        const pendingHol = !isHol && !isVisitor ? pendingHolidayFor(emp.id,dateStr) : null;
        const holAmt = isHol ? (holDates.get(dateStr)||1) : 0;
        const dayShifts = empData.shifts.filter(s=>s.date===dateStr).sort((a,b)=>a.inTs-b.inTs);
        const computed = paidHoursForDay(dayShifts,dateStr,site.id,emp);
        const hasOverride = !isVisitor && hoursOverride[dateStr]!==undefined && hoursOverride[dateStr]!=='';
        const hours = hasOverride ? normaliseTimesheetHours(parseFloat(hoursOverride[dateStr])||0,emp,site.id) : computed;
        if(isHol) holCount += holAmt;
        if(!sevenDay && i===5) satHours += hours; else weekTotal += hours;
        const abs = absenceFor(emp.id, dateStr);
        if(isHol) { anyActivity = true; return isHourly(emp) ? formatTimesheetHours(holAmt,emp,site.id)+'h Hol' : (holAmt===0.5 ? 'Half Hol' : 'Hol'); }
        if(hours>0){ anyActivity = true; return formatTimesheetHours(hours,emp,site.id) + (pendingHol ? ' ⏳' : '') + (dayShifts.some(s=>s.autoClosed) && !hasOverride ? ' (est)' : '') + (hasOverride ? ' (edited)' : ''); }
        if(pendingHol){ anyActivity = true; return '⏳ Pending'; }
        if(abs){ anyActivity = true; return abs.type; }
        return '';
      });
      if(!anyActivity) return; // skip people with nothing that week
      out.push({
        week: weekIso,
        site: site.name,
        name: emp.name + (isVisitor ? ' (visiting)' : ''),
        days: dayVals,
        total: weekTotal>0 ? formatTimesheetHours(weekTotal,emp,site.id) : '',
        overtime: empExtras.overtime!==undefined && empExtras.overtime!=='' ? formatTimesheetHours(empExtras.overtime,emp,site.id) : (satHours>0 ? formatTimesheetHours(satHours,emp,site.id) : ''),
        hols: empExtras.hols!==undefined && empExtras.hols!==''
          ? (isHourly(emp) ? formatTimesheetHours(empExtras.hols,emp,site.id) : empExtras.hols)
          : (holCount>0 ? (isHourly(emp) ? formatTimesheetHours(holCount,emp,site.id) : holCount) : ''),
        sick: empExtras.sick!==undefined ? empExtras.sick : '',
        notes: (extras.notes||{})[site.id] || '',
        locked: lock
      });
    });
  });
  return out;
}

function isTimesheetWeekLocked(weekIso){
  const extras = getWeekExtras(weekIso);
  if(extras.lock && extras.lock.autoUnlocked) return false;
  return !!(extras.lock && extras.lock.locked) || isTimesheetWeekAutomaticallyLocked(weekIso);
}
function timesheetLockInfo(weekIso){
  const extras = getWeekExtras(weekIso);
  if(extras.lock && extras.lock.locked) return extras.lock;
  if(isTimesheetWeekAutomaticallyLocked(weekIso)){
    return {
      locked:true,
      lockedAt:automaticTimesheetLockTime(weekIso),
      lockedBy:'Automatic lock — Monday 12:00'
    };
  }
  return null;
}
/* A completed week becomes read-only at noon on the following Monday.
   This check is based on local UK kiosk time and is enforced anywhere that
   edits a timesheet, even if nobody happened to have the page open at noon. */
function automaticTimesheetLockTime(weekIso){
  const start = fromIso(weekIso);
  return new Date(start.getFullYear(), start.getMonth(), start.getDate()+7, 12, 0, 0, 0).getTime();
}
function isTimesheetWeekAutomaticallyLocked(weekIso, nowTs){
  return (nowTs===undefined ? Date.now() : nowTs) >= automaticTimesheetLockTime(weekIso);
}
async function setTimesheetWeekLock(weekIso, locked){
  const extras = getWeekExtras(weekIso);
  if(locked){
    extras.lock = {
      locked:true,
      lockedAt:Date.now(),
      lockedBy:state.admin.managerName || 'Upper Management'
    };
  }else{
    // Upper Management may temporarily reopen an automatically locked week
    // to make a correction. Keep that exception with the week so it does not
    // immediately lock itself again on the next render.
    extras.lock = isTimesheetWeekAutomaticallyLocked(weekIso)
      ? {locked:false, autoUnlocked:true, unlockedAt:Date.now(), unlockedBy:state.admin.managerName || 'Upper Management'}
      : null;
  }
  const ok = await saveTimesheetExtras();
  // Locking a week means its hours are signed off, so the photos have done
  // their job and are deleted. Keeping them longer than needed would be hard
  // to justify to staff.
  if(ok && locked) await deletePhotosForWeek(weekIso);
  return ok;
}

}

const SICK_NOTE_BUCKET = 'sick-notes';
const SICK_NOTE_MAX_BYTES = 10 * 1024 * 1024;
const SICK_NOTE_TYPES = new Set(['application/pdf','image/jpeg','image/png','image/webp']);
function storagePath(path){
  return String(path||'').split('/').filter(Boolean).map(encodeURIComponent).join('/');
}
function cleanUploadName(name){
  const cleaned = String(name||'document').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/^-+|-+$/g,'');
  return (cleaned || 'document').slice(-120);
}
function sicknessCases(){
  const groups = new Map();
  (state.absences||[]).filter(a=>a && a.type==='sick').forEach(a=>{
    const key = a.caseId ? 'case:'+a.caseId : 'single:'+a.id;
    if(!groups.has(key)) groups.set(key, { key, caseId:a.caseId||null, employeeId:a.employeeId, absences:[], dates:[], notePath:null, noteName:null, noteType:null, noteUploadedAt:null, noteUploadedBy:null, periodStart:null, periodEnd:null });
    const g=groups.get(key);
    g.absences.push(a); g.dates.push(a.date);
    if(a.notePath){ g.notePath=a.notePath; g.noteName=a.noteName||'Sick note'; g.noteType=a.noteType||''; g.noteUploadedAt=a.noteUploadedAt||null; g.noteUploadedBy=a.noteUploadedBy||null; }
    const ps=a.periodStart||a.date, pe=a.periodEnd||a.date;
    if(!g.periodStart || ps<g.periodStart) g.periodStart=ps;
    if(!g.periodEnd || pe>g.periodEnd) g.periodEnd=pe;
  });
  return [...groups.values()].sort((a,b)=> (b.periodEnd||'').localeCompare(a.periodEnd||'') || (employeeById(a.employeeId)?.name||'').localeCompare(employeeById(b.employeeId)?.name||''));
}
function sicknessCaseByKey(key){ return sicknessCases().find(g=>g.key===key) || null; }
function sicknessWorkDates(emp, startIso, endIso){
  const out=[]; let d=fromIso(startIso); const end=fromIso(endIso);
  while(d<=end){
    const ds=iso(d);
    if(hhmmToMinutes(scheduledStartForDow(d.getDay(), emp.siteId, emp))!==null) out.push(ds);
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  }
  return out;
}
async function uploadSickNote(file, emp, caseId){
  if(!file) return null;
  if(!SICK_NOTE_TYPES.has(file.type)) throw new Error('Use PDF, JPG, PNG or WEBP.');
  if(file.size>SICK_NOTE_MAX_BYTES) throw new Error('Sick note must be 10 MB or smaller.');
  const path = `${emp.siteId}/${emp.id}/${caseId}/${Date.now()}-${cleanUploadName(file.name)}`;
  const headers = await authHeaders();
  headers['Content-Type'] = file.type;
  headers['x-upsert'] = 'false';
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${SICK_NOTE_BUCKET}/${storagePath(path)}`, { method:'POST', headers, body:file });
  if(!res.ok){ const msg=await res.text().catch(()=>('HTTP '+res.status)); throw new Error('Upload failed: '+msg.slice(0,180)); }
  return path;
}
async function deleteSickNote(path){
  if(!path) return true;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${SICK_NOTE_BUCKET}`, {
    method:'DELETE', headers:await authHeaders(), body:JSON.stringify({ prefixes:[path] })
  });
  return res.ok;
}
async function openSickNote(path, fileName){
  if(!path) throw new Error('No sick note is attached.');
  const tab = window.open('about:blank','_blank');
  try{
    const headers=await authHeaders(); delete headers['Content-Type'];
    const res=await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/${SICK_NOTE_BUCKET}/${storagePath(path)}`, {headers});
    if(!res.ok) throw new Error('Could not open document ('+res.status+').');
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    if(tab) tab.location.href=url;
    else { const a=document.createElement('a'); a.href=url; a.target='_blank'; a.download=fileName||''; a.click(); }
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  }catch(err){ if(tab) tab.close(); throw err; }
}
function pickSickNoteFile(){
  return new Promise(resolve=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='application/pdf,image/jpeg,image/png,image/webp,.pdf,.jpg,.jpeg,.png,.webp';
    inp.style.display='none'; document.body.appendChild(inp);
    inp.addEventListener('change',()=>{ const f=inp.files&&inp.files[0]?inp.files[0]:null; inp.remove(); resolve(f); },{once:true});
    inp.click();
  });
}

function bradfordWindow(asOfIso){
  const end=fromIso(asOfIso);
  const start=new Date(end.getFullYear(),end.getMonth(),end.getDate()-(52*7));
  return {startIso:iso(start),endIso:asOfIso};
}
function hasScheduledWorkdayBetween(emp, fromIsoDate, toIsoDate){
  let d=fromIso(fromIsoDate);
  d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  const end=fromIso(toIsoDate);
  while(d<end){
    if(hhmmToMinutes(scheduledStartForDow(d.getDay(), emp.siteId, emp))!==null) return true;
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  }
  return false;
}
function bradfordStatsForEmployee(emp, asOfIso){
  const win=bradfordWindow(asOfIso);
  const rows=(state.absences||[])
    .filter(a=>a && a.type==='sick' && a.employeeId===emp.id && a.date>=win.startIso && a.date<=win.endIso)
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const dates=[...new Set(rows.map(a=>a.date))].sort();
  const days=dates.length;

  // New sickness records carry a caseId, so each case is one spell. Older
  // manually-entered sick days may not; for those, consecutive scheduled
  // workdays are treated as one spell so Fri + Mon is not split by a weekend.
  const caseIds=new Set(rows.filter(a=>a.caseId).map(a=>a.caseId));
  const legacyDates=[...new Set(rows.filter(a=>!a.caseId).map(a=>a.date))].sort();
  let legacySpells=0, prev=null;
  legacyDates.forEach(ds=>{
    if(!prev || hasScheduledWorkdayBetween(emp,prev,ds)) legacySpells++;
    prev=ds;
  });
  const spells=caseIds.size+legacySpells;
  return {
    employee:emp,
    spells,
    days,
    score:spells*spells*days,
    lastDate:dates.length?dates[dates.length-1]:null,
    startIso:win.startIso,
    endIso:win.endIso
  };
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }


/* ============================= HOLIDAY DATE MIGRATION ============================= */
function addIsoDaysPure(s, n){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));
  if(!m) return s;
  const d=new Date(Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3])+n));
  return d.toISOString().slice(0,10);
}
function lastSundayIso(year, monthIndex){
  const d=new Date(Date.UTC(year, monthIndex+1, 0)); // last day of month
  const day=d.getUTCDay();
  d.setUTCDate(d.getUTCDate()-day);
  return d.toISOString().slice(0,10);
}
function isUkBstLocalDate(dateStr){
  const y=Number(String(dateStr||'').slice(0,4));
  if(!y) return false;
  const start=lastSundayIso(y,2);  // last Sunday in March
  const end=lastSundayIso(y,9);    // last Sunday in October
  return dateStr>=start && dateStr<=end;
}
function migrateRequestDatesFromOldUtcBug(){
  let shifted=0, requestsChanged=0;
  for(const r of (Array.isArray(state.requests)?state.requests:[])){
    if(!r || r.localDateV2===true) continue;
    let changed=false;
    if(!Array.isArray(r.dates)) r.dates=[];
    r.dates=r.dates.map(d=>{
      if(!d) return d;
      const date=dateEntryDate(d);
      const amount=dateEntryAmount(d);
      if(!date) return d;
      const candidate=addIsoDaysPure(date,1);
      // Under the old code, UK local midnight during BST was stored one day early.
      // Shift only when the intended next local date is in BST. GMT/winter dates stay put.
      if(isUkBstLocalDate(candidate)){
        shifted++;
        changed=true;
        return (typeof d==='string' && amount===1) ? candidate : {date:candidate,amount};
      }
      return d;
    });
    r.localDateV2=true;
    if(changed) requestsChanged++;
  }
  return {shifted,requestsChanged};
}

/* ============================= DATE HELPERS ============================= */
function iso(d){
  // Use the device's LOCAL calendar date, not UTC.
  // toISOString() shifts UK midnight back to the previous date during BST,
  // which made 1 September appear as the 31 August bank holiday.
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fromIso(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function isSunday(d){ return d.getDay()===0; }
function isSaturday(d){ return d.getDay()===6; }
function isBankHoliday(dateStr){ return state.config.bankHolidays.includes(dateStr); }
function isSevenDaySite(siteId){
  const site = state.config.sites.find(s=>s.id===siteId);
  return !!(site && site.tradingPattern==='sevenDay');
}
function siteHours(siteId){
  const site = (state.config.sites||[]).find(s=>s.id===siteId) || {};
  const h = site.hours || {};
  const d = state.config.settings || {};
  return {
    weekdayStart: h.weekdayStart || d.weekdayStart || '08:30',
    weekdayEnd: h.weekdayEnd || d.weekdayEnd || '17:30',
    saturdayStart: h.saturdayStart || d.saturdayStart || '08:30',
    saturdayEnd: h.saturdayEnd || d.saturdayEnd || '13:00',
    sundayStart: h.sundayStart || d.sundayStart || '08:00',
    sundayEnd: h.sundayEnd || d.sundayEnd || '20:00'
  };
}
function siteHoursLabel(siteId){
  const h=siteHours(siteId);
  return `Mon–Fri ${h.weekdayStart}–${h.weekdayEnd}, ` +
    (siteClosedSaturday(siteId) ? 'closed Sat' : `Sat ${h.saturdayStart}–${h.saturdayEnd}`) +
    (isSevenDaySite(siteId)?`, Sun ${h.sundayStart}–${h.sundayEnd}`:'');
}
/* Which calendar days count as "a day they'd normally have worked" for
   holiday-day counting. Seven-day sites (e.g. petrol stations) work every
   day including Sundays and bank holidays, so none of those are excluded
   for them — unlike the standard Mon–Sat-minus-bank-holidays sites. */
function isWorkingHolidayDay(d, siteId){
  if(isSevenDaySite(siteId)) return true;
  return !isSunday(d) && !isSaturday(d) && !isBankHoliday(iso(d));
}
function computeWorkingDays(startStr, endStr, siteId){
  if(!startStr || !endStr) return [];
  let start = fromIso(startStr), end = fromIso(endStr);
  if(end < start) return [];
  const out = [];
  let cur = new Date(start);
  while(cur <= end){
    if(isWorkingHolidayDay(cur, siteId)) out.push(iso(cur));
    cur.setDate(cur.getDate()+1);
  }
  return out;
}
function fmtDate(dateStr){
  const d = fromIso(dateStr);
  return d.toLocaleDateString('en-GB',{ weekday:'short', day:'numeric', month:'short', year:'numeric' });

function fmtDateShort(dateStr){

function weekStartMonday(d){
  const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = dt.getDay();
  const diff = day===0 ? -6 : 1-day;
  dt.setDate(dt.getDate()+diff);
  return dt;
}
function computeAllShifts(){
  const byEmp = {};
  state.events.forEach(ev=>{ (byEmp[ev.employeeId] = byEmp[ev.employeeId]||[]).push(ev); });
  const map = {};
  const todayStr = iso(new Date());
  Object.keys(byEmp).forEach(empId=>{
    const evs = byEmp[empId].slice().sort((a,b)=>a.timestamp-b.timestamp);
    const shifts = []; let pendingIn = null, pendingSite = null, pendingEnteredBy = null;
    const emp = employeeById(empId);
    evs.forEach(ev=>{
      if(ev.type==='in'){
        pendingEnteredBy = ev.enteredBy || ev.editedBy || null;
        // A new clock-in while one is still open means the previous day's
        // shift was never closed. Auto-close it at that day's scheduled
        // finish time and flag it so a manager can correct it.
        if(pendingIn!==null){
          const openDate = iso(new Date(pendingIn));
          shifts.push(autoClosedShift(openDate, pendingIn, pendingSite, emp));
        }
        pendingIn = ev.timestamp; pendingSite = ev.siteId || null;
      }
      else if(ev.type==='out' && pendingIn!==null){
        shifts.push({ date: iso(new Date(pendingIn)), inTs: pendingIn, outTs: ev.timestamp, siteId: pendingSite, managerEntered: !!(pendingEnteredBy || ev.enteredBy || ev.editedBy) });
        pendingIn = null; pendingSite = null;
      }
    });
    let openShift = null;
    if(pendingIn!==null){
      const openDate = iso(new Date(pendingIn));
      if(openDate === todayStr && Date.now() < automaticClockOutTime(openDate, pendingSite, emp)){
        openShift = { date: openDate, inTs: pendingIn, siteId: pendingSite }; // still on site today
      } else {
        shifts.push(autoClosedShift(openDate, pendingIn, pendingSite, emp)); // forgot to clock out by the applicable cut-off
      }
    }
    map[empId] = { shifts, openShift };
  });
  return map;
}
/* Forgotten clock-outs at filling stations use that site's saved closing
   time for the day. Workshops use the company-wide 18:30 cut-off. */
function automaticClockOutTime(dateStr, siteId, emp){
  const d = fromIso(dateStr);
  const effectiveSiteId = siteId || (emp && emp.siteId) || null;
  let cutOff = '18:30';
  if(isFillingStationSite(effectiveSiteId)){
    const h = siteHours(effectiveSiteId);
    cutOff = d.getDay()===0 ? h.sundayEnd : (d.getDay()===6 ? h.saturdayEnd : h.weekdayEnd);
  }
  const parts = String(cutOff || '18:30').split(':').map(Number);
  const hour = Number.isFinite(parts[0]) ? parts[0] : 18;
  const minute = Number.isFinite(parts[1]) ? parts[1] : 30;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), hour, minute, 0, 0).getTime();
}
/* Builds a forgotten shift closed at the applicable cut-off, marked so the timesheet can flag
   it as an automatic entry needing a manager's attention. Paid hours are
   still clamped to the employee/site scheduled finish by the timesheet. */
function autoClosedShift(dateStr, inTs, siteId, emp){
  let outTs = automaticClockOutTime(dateStr, siteId, emp);
  if(outTs < inTs) outTs = inTs;
  return { date: dateStr, inTs, outTs, siteId, autoClosed: true };
}
function shiftSite(shift, emp){ return shift.siteId || (emp ? emp.siteId : null); }
function currentSiteId(empId){
  const last = lastEventFor(empId);
  const emp = employeeById(empId);
  return (last && last.siteId) || (emp ? emp.siteId : null);
}

function lastEventFor(employeeId){

/* Someone is only genuinely "on site now" if their open clock-in is from
   today. An open clock-in from a previous day means they forgot to clock
   out — they are not present, and the shift needs closing. */
function isStaleOpenShift(employeeId){
  const last = lastEventFor(employeeId);
  if(!last || last.type!=='in') return false;
  const emp = employeeById(employeeId);
  const clockDate = iso(new Date(last.timestamp));
  return clockDate !== iso(new Date()) || Date.now() >= automaticClockOutTime(clockDate, last.siteId, emp);
}

/* A request's dates array holds either plain 'YYYY-MM-DD' strings (full day,
   all requests before half-days existed) or {date, amount} objects where
   amount is 1 or 0.5. These helpers read either form. */
function dateEntryDate(d){ return typeof d==='string' ? d : d.date; }
function dateEntryAmount(d){ return typeof d==='string' ? 1 : (d.amount || 1); }
function requestDayCount(r){ return (Array.isArray(r&&r.dates)?r.dates:[]).reduce((sum,d)=>sum+(d?dateEntryAmount(d):0), 0); }
function holidayCoverEmployeeId(r){
  if(!r) return '';
  return String(r.coverEmployeeId||((Array.isArray(r.dates)&&r.dates[0]&&typeof r.dates[0]==='object')?r.dates[0].coverEmployeeId:'')||'');
}
function holidayCoverName(r){

}
function requestAmountForDate(r, dateStr){
  const entry = r.dates.find(d=>dateEntryDate(d)===dateStr);
  return entry ? dateEntryAmount(entry) : 1;
}
function approvedAmountForEmployeeDate(empId, dateStr, excludeRequestId){
  let total = 0;
  (Array.isArray(state.requests)?state.requests:[]).forEach(r=>{
    if(!r || r.status!=='approved' || r.employeeId!==empId || r.id===excludeRequestId) return;
    (Array.isArray(r.dates)?r.dates:[]).forEach(d=>{
      if(d && dateEntryDate(d)===dateStr) total += dateEntryAmount(d);
    });
  });
  return Math.min(1, total);
}
function approvedEmployeeEntriesForDate(dateStr, excludeRequestId){
  const byEmployee = new Map();
  (Array.isArray(state.requests)?state.requests:[]).forEach(r=>{
    if(!r || r.status!=='approved' || r.id===excludeRequestId) return;
    const amount = (Array.isArray(r.dates)?r.dates:[])
      .filter(d=>d && dateEntryDate(d)===dateStr)
      .reduce((sum,d)=>sum+dateEntryAmount(d),0);
    if(amount<=0) return;
    const prev = byEmployee.get(r.employeeId)||0;
    byEmployee.set(r.employeeId, Math.min(1, prev+amount));
  });
  return Array.from(byEmployee.entries()).map(([employeeId,amount])=>({employeeId,amount}));
}
function approvedRequestsCoveringDate(dateStr, excludeRequestId){
  // Return one representative approved request per employee so duplicates do not
  // inflate company-wide headcount/conflict checks.
  const seen = new Set();
  const out = [];
  (Array.isArray(state.requests)?state.requests:[]).forEach(r=>{
    if(!r || r.status!=='approved' || r.id===excludeRequestId || seen.has(r.employeeId)) return;
    if((Array.isArray(r.dates)?r.dates:[]).some(d=>d && dateEntryDate(d)===dateStr)){
      seen.add(r.employeeId);
      out.push(r);
    }
  });
  return out;
}
function offCountForDate(dateStr){
  return approvedEmployeeEntriesForDate(dateStr).length;
}
function approvedDatesForEmployee(empId){
  const map = new Map();
  const emp = employeeById(empId);
  (Array.isArray(state.requests)?state.requests:[]).filter(r=>r && r.employeeId===empId && r.status==='approved').forEach(r=>{
    (Array.isArray(r.dates)?r.dates:[]).forEach(d=>{
      if(!d) return;
      const date = dateEntryDate(d), amount = dateEntryAmount(d);
      if(date){
        const total = (map.get(date)||0) + amount;
        map.set(date, isHourly(emp) ? total : Math.min(1, total));
      }
    });
  });
  return map;
}
function pendingHolidayFor(empId, dateStr){
  return (Array.isArray(state.requests)?state.requests:[]).find(r=>r && r.employeeId===empId && r.status==='pending' && (Array.isArray(r.dates)?r.dates:[]).some(d=>d && dateEntryDate(d)===dateStr));
}
function siteClosedSaturday(siteId){
  const s = (state.config.sites||[]).find(x=>x.id===siteId);
  return !!(s && s.noSaturday);
}
/* Staff who work through their dinner get no unpaid break deducted. */
function worksThroughLunch(emp){ return !!(emp && emp.noLunchBreak); }

/* Great Ayton filling-station shifts are paid without an automatic dinner
   deduction. Peterlee petrol/convenience has its own over-4.5-hour rule. */
function hasPaidDinner(emp, siteId){
  const effectiveSiteId=(emp&&emp.siteId)||siteId;
  if(isPeterleeFillingStationSite(effectiveSiteId)) return false;
  return !!(emp && (emp.noLunchBreak || isFillingStationSite(effectiveSiteId)));
}

/* Calculate one day's paid hours in one place so the screen and downloaded
   payroll file can never apply different dinner-break rules. */
function paidHoursForDay(dayShifts, dateStr, siteId, emp){
  const shifts=(Array.isArray(dayShifts)?dayShifts:[]).slice().sort((a,b)=>a.inTs-b.inTs);
  let hours=0;
  shifts.forEach((s,index)=>{
    hours += clampedHoursForShift(s.date, s.inTs, s.outTs, siteId, index===0, emp);
  });
  const dow=fromIso(dateStr).getDay();
  const peterleeDinner=isPeterleeFillingStationSite((emp&&emp.siteId)||siteId)&&hours>4.5;
  const workshopDinner=dow>=1&&dow<=5&&hours>0&&!hasPaidDinner(emp,siteId)&&!isFillingStationSite((emp&&emp.siteId)||siteId);
  if(peterleeDinner||workshopDinner){
    const intervals=shifts
      .map((s,index)=>clampedIntervalForShift(s.date,s.inTs,s.outTs,siteId,index===0,emp))
      .filter(iv=>iv.end>iv.start)
      .sort((a,b)=>a.start-b.start);
    let breakHours=0;
    for(let i=1;i<intervals.length;i++){
      const gap=(intervals[i].start-intervals[i-1].end)/3600000;
      if(gap>0) breakHours+=gap;
    }
    hours=Math.max(0,hours-Math.max(0,0.5-breakHours));
  }
  return normaliseTimesheetHours(hours,emp,siteId);
}

function scheduledStartForDow(dow, siteId, emp){
  const h=siteHours(siteId);
  if(dow===0) return isSevenDaySite(siteId) ? h.sundayStart : null;
  if(dow===6) return siteClosedSaturday(siteId) ? null : h.saturdayStart;
  // An individual can have their own weekday hours; falls back to the site's.
  return (emp && emp.customStart) ? emp.customStart : h.weekdayStart;
}
function scheduledEndForDow(dow, siteId, emp){
  const h=siteHours(siteId);
  if(dow===0) return isSevenDaySite(siteId) ? h.sundayEnd : null;
  if(dow===6) return siteClosedSaturday(siteId) ? null : h.saturdayEnd;
  return (emp && emp.customEnd) ? emp.customEnd : h.weekdayEnd;
}
function hhmmToMinutes(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
/* Paid hours for a shift: clamped to the day's scheduled window (clocking in
   early or leaving late past that window earns nothing extra unless it's
   already logged as Saturday overtime), then a 30-minute unpaid lunch is
   deducted from weekday shifts. Uses the shift's own date, not "today". */
/* Clamps a single shift's hours to that day's scheduled window — clocking
   in early or leaving late past the window earns nothing extra. Lunch is
   NOT deducted here; it's handled once per day (see below), since someone
   who clocks out and back in for lunch has already excluded that gap. */
function roundUpToQuarterHour(ts){
  const d=new Date(ts);
  const mins=d.getMinutes();
  const secs=d.getSeconds();
  const ms=d.getMilliseconds();
  if(mins%15===0 && secs===0 && ms===0) return ts;
  const add=15-(mins%15);
  d.setMinutes(mins+add,0,0);
  return d.getTime();
}
function roundTimestampToNearestMinutes(ts, intervalMinutes){
  const d=new Date(ts);
  const minuteValue=d.getMinutes()+(d.getSeconds()/60)+(d.getMilliseconds()/60000);
  const rounded=Math.round(minuteValue/intervalMinutes)*intervalMinutes;
  d.setMinutes(rounded,0,0);
  return d.getTime();
}
function clampedHoursForShift(dateStr, inTs, outTs, siteId, roundLateStart, emp){
  const d = fromIso(dateStr);
  const dow = d.getDay();
  const startStr = scheduledStartForDow(dow, siteId, emp), endStr = scheduledEndForDow(dow, siteId, emp);
  if(!startStr || !endStr) return Math.max(0, (outTs-inTs)/3600000); // closed that day: no clamp
  const startMin = hhmmToMinutes(startStr), endMin = hhmmToMinutes(endStr);
  const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(startMin/60), startMin%60).getTime();
  const dayEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(endMin/60), endMin%60).getTime();

  const fillingStation=isFillingStationSite((emp&&emp.siteId)||siteId);
  let effectiveIn;
  let clampedOut;
  if(fillingStation){
    // Station shifts can begin throughout the day: clock-in goes to the
    // closest quarter-hour and clock-out to the closest five minutes. Do not
    // clamp the start to the public opening time because station shift patterns
    // can legitimately begin earlier (for example 05:45).
    effectiveIn=roundTimestampToNearestMinutes(inTs,15);
    // A station shift can legitimately finish after the site's configured
    // public closing time. Use the actual rounded clock-out; the scheduled
    // finish remains the safety cut-off only when somebody forgets to clock out.
    clampedOut=roundTimestampToNearestMinutes(outTs,5);
  } else {
    // Workshops credit an early/on-time arrival from the scheduled start.
    // From 08:31 (or one minute after a custom start) the first clock-in is
    // moved forward to the next quarter-hour. Work after the scheduled finish
    // is capped at that finish (normally 17:30).
    effectiveIn=Math.max(inTs,dayStart);
    if(roundLateStart && inTs>=dayStart+60000) effectiveIn=roundUpToQuarterHour(inTs);
    clampedOut=Math.min(outTs,dayEnd);
  }
  return Math.max(0, (clampedOut-effectiveIn)/3600000);
}

/* Same clamping, but returns the actual start/end so the gaps between a day's
   shifts can be measured. Used to work out how much break was really taken. */
function clampedIntervalForShift(dateStr, inTs, outTs, siteId, roundLateStart, emp){
  const d = fromIso(dateStr);
  const dow = d.getDay();
  const startStr = scheduledStartForDow(dow, siteId, emp), endStr = scheduledEndForDow(dow, siteId, emp);
  if(!startStr || !endStr) return { start: inTs, end: Math.max(inTs, outTs) };
  const startMin = hhmmToMinutes(startStr), endMin = hhmmToMinutes(endStr);
  const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(startMin/60), startMin%60).getTime();
  const dayEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(endMin/60), endMin%60).getTime();
  const fillingStation=isFillingStationSite((emp&&emp.siteId)||siteId);
  let effectiveIn;
  let clampedOut;
  if(fillingStation){
    effectiveIn=roundTimestampToNearestMinutes(inTs,15);
    clampedOut=roundTimestampToNearestMinutes(outTs,5);
  } else {
    effectiveIn=Math.max(inTs,dayStart);
    if(roundLateStart && inTs>=dayStart+60000) effectiveIn=roundUpToQuarterHour(inTs);
    clampedOut=Math.min(outTs,dayEnd);
  }
  return { start: effectiveIn, end: Math.max(effectiveIn, clampedOut) };
}
function firstInToday(empId, dateStr){
  const evs = state.events.filter(e=>e.employeeId===empId && e.type==='in' && iso(new Date(e.timestamp))===dateStr);
  if(!evs.length) return null;

function findPinConflict(pin, excludeType, excludeId){

/* ---- accrued holiday balance: opening balance + 1.66/month, minus approved days since opening ---- */
function accrualMonthsElapsed(emp, asOfDate){
  const ref = asOfDate || iso(new Date());
  const openDateStr = emp.openingBalanceDate || ref;
  const openDate = fromIso(openDateStr);
  const refDate = fromIso(ref);
  let months = (refDate.getFullYear()-openDate.getFullYear())*12 + (refDate.getMonth()-openDate.getMonth());
  return months>0 ? months : 0;
}
function holidayApprovedSinceOpening(emp, asOfDate){
  const ref = asOfDate || iso(new Date());
  const openDateStr = emp.openingBalanceDate || ref;
  const map = approvedDatesForEmployee(emp.id);
  let total = 0;
  map.forEach((amount,date)=>{
    if(date>=openDateStr && date<=ref) total += isHourly(emp) ? amount : Math.min(1, amount);
  });
  return total;
}
function accruedToDate(emp, asOfDate){
  const rate = (emp.monthlyRate!==undefined && emp.monthlyRate!==null) ? emp.monthlyRate
    : (state.config.settings.monthlyAccrualRate!==undefined ? state.config.settings.monthlyAccrualRate : 1.66);
  const annualCap = emp.allowanceDays || state.config.settings.defaultAnnualEntitlement || 20;
  const opening = emp.openingBalance || 0;
  const accrued = opening + accrualMonthsElapsed(emp, asOfDate)*rate;
  return Math.min(accrued, opening + annualCap);
}
function availableBalance(emp, asOfDate){
  // Not floored at zero — a negative balance means they've taken more than
  // they've accrued so far, which is real information admin needs to see.
  return accruedToDate(emp, asOfDate) - holidayApprovedSinceOpening(emp, asOfDate);
}
/* Petrol-station holidays are always recorded in hours. The site check keeps
   this true even if an old employee record is missing its holidayUnit flag. */
function isHourly(emp){ return !!(emp && (emp.holidayUnit==='hours' || isFillingStationSite(emp.siteId))); }
function unitLabel(emp){ return isHourly(emp) ? 'hrs' : 'days'; }
function fmtBalance(emp, asOfDate){
  const bal = availableBalance(emp, asOfDate);
  return bal.toFixed(2)+' '+unitLabel(emp);
}
function formatHolidayAmount(emp, value){
  const n=Number(value);
  if(!Number.isFinite(n)) return isHourly(emp)?'0.00':'0';
  return isHourly(emp)?n.toFixed(2):String(n);
}

const app = document.getElementById('app');
let _rendering = false;
function render(){
  // A redraw must never trigger another redraw. Without this, one stray event
  // fired by an element being replaced can loop until the browser gives up.
  if(_rendering) return;
  _rendering = true;
  try{ _render(); } finally { _rendering = false; }
}
function _render(){
  let html = '';
  try{
    if(state.view==='loading') html = renderLoading();
    else if(state.view==='home') html = renderHome();
    else if(state.view==='kiosk-setup') html = renderKioskSetup();
    else if(state.view==='privacy') html = renderPrivacyNotice();
    else if(state.view==='pin') html = renderPin();
    else if(state.view==='clock') html = renderClock();
  else if(state.view==='change-pin') html = renderChangePin();
    else if(state.view==='clock-confirm') html = renderClockConfirm();
    else if(state.view==='holiday') html = renderHoliday();
    else if(state.view==='holiday-confirm') html = renderHolidayConfirm();
    else if(state.view==='admin-pin') html = renderAdminPin();
    else if(state.view==='admin') html = renderAdmin();
  }catch(err){
    console.error('Shift Board render failed:', err);
    if(state.view==='admin'){
      html = `${topstrip()}<div class="flow"><div class="flow-card" style="width:460px;">
        <h2>That screen could not be displayed</h2>
        <div class="sub">You are still signed in — this is a fault in the page, not your login.</div>
        <div class="error-msg" style="text-align:left;word-break:break-word;">${String(err && err.message ? err.message : err)}</div>
        <button type="button" class="action-btn" data-action="admin-back-register">Back to Register</button>
        <div class="back-link" data-action="admin-exit">Sign out</div>
      </div></div>`;
    }else{
      html = `<div class="flow"><div class="flow-card"><h2>Shift Board</h2><div class="error-msg">${String(err && err.message ? err.message : err)}</div><button type="button" class="action-btn secondary" onclick="location.reload()">Reload</button></div></div>`;
    }
  }
  app.innerHTML = html;
  attachHandlers();
}

/* ---------- LIVE SALES ---------- */
function salesHtml(v){
  return String(v==null?'':v).replace(/[&<>\"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]; });
}
function salesMoney(v){
  if(v===null || v===undefined || v==='') return 'N/A';
  const n=Number(v); if(!Number.isFinite(n)) return 'N/A';
  return '£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function salesPct(v){
  if(v===null || v===undefined || v==='') return 'N/A';
  const n=Number(v); if(!Number.isFinite(n)) return 'N/A';
  return n.toLocaleString('en-GB',{minimumFractionDigits:0,maximumFractionDigits:2})+'%';
}
function salesNum(v){ const n=Number(v||0); return Number.isFinite(n)?n:0; }
function salesDateLabel(v){
  if(!v) return '—';
  const d=new Date(String(v)+'T12:00:00');
  return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
}
function salesCompletedLabel(v){
  if(!v) return '';
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return '';
  return d.toLocaleString('en-GB',{timeZone:'Europe/London',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
}
function salesCsvCell(v){
  if(v===null || v===undefined) return '';
  const s=String(v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function salesGroupRow(rows){
  const sum=k=>rows.reduce((a,r)=>a+salesNum(r[k]),0);
  const avg=k=>{ const vals=rows.map(r=>r[k]).filter(v=>v!==null&&v!==undefined&&v!=='').map(Number).filter(Number.isFinite); return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null; };
  return {
    site_name:'NEAS Group', davanti:sum('davanti'), tracking:sum('tracking'), bfc:sum('bfc'), coolant:sum('coolant'), pollen:sum('pollen'), ac:sum('ac'), diag:sum('diag'),
    cons:sum('cons'), full_service:sum('full_service'), interim:sum('interim'), oil:sum('oil'), itms_value:sum('itms_value'), add_on_count:sum('add_on_count'), add_on_value:sum('add_on_value'),
    margin_current:avg('margin_current'), margin_prior:avg('margin_prior'), total_current:sum('total_current'),
    total_prior:rows.reduce((a,r)=>a+(r.comparison_available?salesNum(r.total_prior):0),0), comparison_available:true
  };
}
function salesRangePoint(history,targetDate,selectedSite,expectedSites,{before=false}={}){
  if(!Array.isArray(history) || !history.length || !targetDate) return null;
  const monthPrefix=String(targetDate).slice(0,7);
  const good=history.filter(r=>{
    const d=String(r.snapshot_date||'');
    if(!d.startsWith(monthPrefix) || r.import_status!=='ok') return false;
    return before ? d<String(targetDate) : d<=String(targetDate);
  });
  if(selectedSite && selectedSite!=='all'){
    const rows=good.filter(r=>String(r.site_key)===String(selectedSite)).sort((a,b)=>String(b.snapshot_date).localeCompare(String(a.snapshot_date)));
    return rows.length ? {date:String(rows[0].snapshot_date),row:rows[0]} : null;
  }
  const byDate=new Map();
  good.forEach(r=>{
    const d=String(r.snapshot_date||'');
    if(!byDate.has(d)) byDate.set(d,[]);
    byDate.get(d).push(r);
  });
  const dates=[...byDate.keys()].sort().reverse();
  for(const d of dates){
    const dayRows=byDate.get(d)||[];
    if(dayRows.length<expectedSites || dayRows.some(r=>r.import_status!=='ok')) continue;
    return {date:d,row:salesGroupRow(dayRows)};
  }
  return null;
}
function salesRangeDelta(rows){
  const history=state.admin.salesHistory||[];
  const selected=state.admin.salesRangeSite||'all';
  const latest=String(rows?.[0]?.snapshot_date||'');
  if(!latest) return {error:'No sales snapshots are available.'};
  const monthStart=latest.slice(0,8)+'01';
  if(!state.admin.salesRangeFrom) state.admin.salesRangeFrom=monthStart;
  if(!state.admin.salesRangeTo) state.admin.salesRangeTo=latest;
  const from=String(state.admin.salesRangeFrom||'');
  const to=String(state.admin.salesRangeTo||'');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(from) || !/^\d{4}-\d{2}-\d{2}$/.test(to)) return {error:'Choose a From and To date.'};
  if(from>to) return {error:'The From date must be before the To date.'};
  if(from.slice(0,7)!==to.slice(0,7)) return {error:'For now, choose dates within the same calendar month.'};
  const expectedSites=rows.length;
  const end=salesRangePoint(history,to,selected,expectedSites);
  if(!end) return {error:'There is no successful sales snapshot on or before that To date.'};

  let base={date:null,row:{
    davanti:0,tracking:0,bfc:0,coolant:0,pollen:0,ac:0,diag:0,cons:0,full_service:0,interim:0,oil:0,
    itms_value:0,add_on_count:0,add_on_value:0,total_current:0
  }};
  if(!from.endsWith('-01')){
    const found=salesRangePoint(history,from,selected,expectedSites,{before:true});
    if(!found) return {error:'There is no successful saved snapshot before the From date, so that period cannot be calculated accurately yet.'};
    base=found;
  }

  const keys=['davanti','tracking','bfc','coolant','pollen','ac','diag','cons','full_service','interim','oil','itms_value','add_on_count','add_on_value','total_current'];
  const delta={};
  keys.forEach(k=>{ delta[k]=salesNum(end.row[k])-salesNum(base.row[k]); });
  const addonCountReady=!(salesNum(end.row.add_on_count)===0 && salesNum(end.row.add_on_value)>0);
  return {from,to,endDate:end.date,baseDate:base.date,delta,addonCountReady,selected};
}
function renderSalesDateRange(rows){
  const selected=state.admin.salesRangeSite||'all';
  const latest=String(rows?.[0]?.snapshot_date||'');
  const monthStart=latest ? latest.slice(0,8)+'01' : '';
  const from=state.admin.salesRangeFrom||monthStart;
  const to=state.admin.salesRangeTo||latest;
  const options=`<option value="all" ${selected==='all'?'selected':''}>NEAS Group</option>`+rows.map(r=>`<option value="${salesHtml(r.site_key)}" ${selected===String(r.site_key)?'selected':''}>${salesHtml(r.site_name)}</option>`).join('');
  const result=salesRangeDelta(rows);
  let output='';
  if(result.error){
    output=`<div style="margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px;">${salesHtml(result.error)}</div>`;
  }else{
    const d=result.delta;
    const qty=result.addonCountReady ? salesNum(d.add_on_count) : null;

    output=`<div style="margin-top:13px;">

async function loadSalesData(force){
  if(!canViewWorkshopSales() && !canAccessBonusSheet()) return;
  if(state.admin._loadingSales) return;
  if(state.admin.salesRows && !force) return;
  state.admin._loadingSales=true;
  try{
    const headers=await authHeaders();
    const snapUrl=SUPABASE_URL + '/rest/v1/sales_daily_snapshots?select=*&order=snapshot_date.desc,site_name.asc&limit=800';
    const runUrl=SUPABASE_URL + '/rest/v1/sales_import_runs?select=*&order=run_date.desc&limit=1';
    const [sr,rr]=await Promise.all([
      fetch(snapUrl,{headers,cache:'no-store'}),
      fetch(runUrl,{headers,cache:'no-store'})
    ]);
    if(!sr.ok) throw new Error('Sales data '+sr.status);
    const all=await sr.json();
    const latestDate=(all&&all[0]&&all[0].snapshot_date)||null;
    state.admin.salesHistory=(all||[]);
    state.admin.salesRows=(all||[]).filter(x=>x.snapshot_date===latestDate);
    state.admin.salesRun=rr.ok ? ((await rr.json())||[])[0]||null : null;
    state.admin.salesLoadedAt=Date.now();
  }catch(err){
    console.error('Live sales load failed',err);
    state.admin.salesRows=[];
    state.admin.salesHistory=[];
    state.admin.salesRun={status:'failed',message:err.message||String(err)};
  }
  state.admin._loadingSales=false;
}
