function analysisSumNullable(rows,key){
  const values=(rows||[]).map(r=>r?.[key]).filter(v=>v!==null&&v!==undefined&&v!=='').map(Number).filter(Number.isFinite);
  return values.length?values.reduce((n,v)=>n+v,0):null;
}
function analysisAggregate(rows){
  const grouped={};
  (rows||[]).forEach(r=>{
    const key=String(r.site_key||'');
    if(!key) return;
    (grouped[key]||(grouped[key]=[])).push(r);
  });
  return Object.entries(grouped).map(([site_key,list])=>{
    const totalNet=analysisSumNullable(list,'total_net');
    const weighted=list.filter(r=>r.margin_pct!==null&&r.margin_pct!==undefined&&Number(r.total_net)>0);
    const weight=weighted.reduce((n,r)=>n+Number(r.total_net),0);
    return {
      site_key, site_name:list[0]?.site_name||site_key,
      ac:analysisSumNullable(list,'ac'), diag:analysisSumNullable(list,'diag'), bfc:analysisSumNullable(list,'bfc'),
      coolant:analysisSumNullable(list,'coolant'), pollen:analysisSumNullable(list,'pollen'), box_oil:analysisSumNullable(list,'box_oil'),
      cons:analysisSumNullable(list,'cons'), tracking:analysisSumNullable(list,'tracking'),
      total_net:totalNet, upsell_value:analysisSumNullable(list,'upsell_value'),
      margin_pct:weight?weighted.reduce((n,r)=>n+(Number(r.total_net)*Number(r.margin_pct)),0)/weight:null,
      as_of:list.map(r=>String(r.as_of||'')).sort().pop()||''
    };
  }).sort((a,b)=>String(a.site_name).localeCompare(String(b.site_name)));
}
function salesVsData(){
  const all=state.admin.analysisRows||[];
  const mode=state.admin.vsMode==='year'?'year':'month';
  const periods=[...new Set(all.map(r=>mode==='year'?String(r.month_start).slice(0,4):String(r.month_start).slice(0,7)))].sort().reverse();
  if(!periods.includes(state.admin.vsA)) state.admin.vsA=periods[0]||'';
  if(!periods.includes(state.admin.vsB) || state.admin.vsB===state.admin.vsA){
    const prior=mode==='year'
      ? String(Number(state.admin.vsA)-1)
      : String(Number(state.admin.vsA.slice(0,4))-1)+'-'+state.admin.vsA.slice(5,7);
    state.admin.vsB=periods.includes(prior)?prior:(periods.find(p=>p!==state.admin.vsA)||'');
  }
  const match=(r,p)=>mode==='year'?String(r.month_start).slice(0,4)===p:String(r.month_start).slice(0,7)===p;
  const a=analysisAggregate(all.filter(r=>match(r,state.admin.vsA)));
  const b=analysisAggregate(all.filter(r=>match(r,state.admin.vsB)));
  const mapA=Object.fromEntries(a.map(r=>[r.site_key,r])), mapB=Object.fromEntries(b.map(r=>[r.site_key,r]));
  const keys=[...new Set([...a,...b].map(r=>r.site_key))].sort((x,y)=>String(mapA[x]?.site_name||mapB[x]?.site_name).localeCompare(String(mapA[y]?.site_name||mapB[y]?.site_name)));
  const site=state.admin.vsSite||'all';
  const visible=keys.filter(k=>site==='all'||k===site).map(k=>({site_key:k,site_name:mapA[k]?.site_name||mapB[k]?.site_name||k,a:mapA[k]||null,b:mapB[k]||null}));
  return {all,mode,periods,a,b,mapA,mapB,keys,site,visible};
}
function salesVsLabel(period,mode){ return mode==='year'?period:salesAnalysisMonthLabel(period); }
function salesVsNumber(v,type){
  if(v===null||v===undefined||v===''||!Number.isFinite(Number(v))) return '—';
  return type==='money'?salesMoney(v):type==='percent'?salesPct(v):salesNum(v);
}
function salesVsDifference(a,b,type){
  if(a===null||a===undefined||b===null||b===undefined||!Number.isFinite(Number(a))||!Number.isFinite(Number(b))) return '—';
  const d=Number(a)-Number(b), sign=d>0?'+':d<0?'−':'';
  const shown=type==='money'?salesMoney(Math.abs(d)):type==='percent'?Math.abs(d).toFixed(2)+' pts':salesNum(Math.abs(d));
  return sign+shown;
}
function salesVsSummary(rows,key){ return analysisSumNullable((rows||[]).map(x=>x?.[key]?x:{[key]:x?.[key]}),key); }
function salesVsWeightedMargin(rows){
  const valid=(rows||[]).filter(r=>r&&r.margin_pct!==null&&r.total_net!==null&&Number(r.total_net)>0);
  const total=valid.reduce((n,r)=>n+Number(r.total_net),0);
  return total?valid.reduce((n,r)=>n+(Number(r.total_net)*Number(r.margin_pct)),0)/total:null;
}

/* ---------- PRIVATE MOT RECONCILIATION ---------- */
function motHeaderKey(value){ return String(value||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function motReg(value){ return String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function motMonthHint(name){
  const s=String(name||'');
  let m=s.match(/(?:^|\D)(?:0?1)[-_.]?(0[1-9]|1[0-2])(20\d{2})(?:\D|$)/);
  if(m) return m[2]+'-'+m[1];
  m=s.match(/(20\d{2})[-_.](0[1-9]|1[0-2])/);
  return m?m[1]+'-'+m[2]:'';
}
function motDate(value,hint){
  const s=String(value||'').trim();
  let m=s.match(/^(20\d{2})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(!m) return '';
  let a=Number(m[1]), b=Number(m[2]), y=Number(m[3]); if(y<100) y+=2000;
  let day=a, month=b;
  if(hint){
    const hm=Number(hint.slice(5,7));
    if(a===hm&&b!==hm){ month=a; day=b; }
    else if(b===hm){ month=b; day=a; }
  } else if(a<=12&&b>12){ month=a; day=b; }
  if(month<1||month>12||day<1||day>31) return '';
  return `${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

const TARGET_SITE_ORDER = Object.keys(TARGET_SITE_DEFAULTS);
function targetWorkshopSites(){
  const seen=new Set();
  return (state.config.sites||[]).map(site=>({site,key:bonusSiteKey(site.name)})).filter(x=>{
    if(!x.key || !TARGET_SITE_DEFAULTS[x.key] || isFillingStationSite(x.site.id) || seen.has(x.key)) return false;
    seen.add(x.key); return true;
  }).sort((a,b)=>TARGET_SITE_ORDER.indexOf(a.key)-TARGET_SITE_ORDER.indexOf(b.key));
}
function targetSiteInfo(siteId){ return targetWorkshopSites().find(x=>String(x.site.id)===String(siteId))||null; }
function targetMonthLabel(month){
  if(!/^\d{4}-\d{2}$/.test(String(month||''))) return String(month||'');
  return new Date(month+'-01T12:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}
function targetDateAt(year,month,day){ return new Date(year,month,day,12,0,0,0); }
function targetNthWeekday(year,month,weekday,n){
  const d=targetDateAt(year,month,1);
  d.setDate(1+((7+weekday-d.getDay())%7)+((n-1)*7));
  return d;
}
function targetLastWeekday(year,month,weekday){
  const d=targetDateAt(year,month+1,0);
  d.setDate(d.getDate()-((7+d.getDay()-weekday)%7));
  return d;
}
function targetEasterSunday(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31)-1, day=((h+l-7*m+114)%31)+1;
  return targetDateAt(year,month,day);
}
function targetBankHolidaySet(year){
  const out=new Set((state.config.bankHolidays||[]).filter(x=>String(x).startsWith(year+'-')));
  const add=d=>out.add(iso(d));
  const newYear=targetDateAt(year,0,1);
  if(newYear.getDay()===6) add(targetDateAt(year,0,3));
  else if(newYear.getDay()===0) add(targetDateAt(year,0,2));
  else add(newYear);
  const easter=targetEasterSunday(year);
  const goodFriday=new Date(easter); goodFriday.setDate(easter.getDate()-2); add(goodFriday);
  const easterMonday=new Date(easter); easterMonday.setDate(easter.getDate()+1); add(easterMonday);
  add(targetNthWeekday(year,4,1,1));
  add(targetLastWeekday(year,4,1));
  add(targetLastWeekday(year,7,1));
  const christmas=[targetDateAt(year,11,25),targetDateAt(year,11,26)];
  christmas.forEach(d=>{ if(d.getDay()!==0&&d.getDay()!==6) add(d); });
  christmas.forEach(d=>{
    if(d.getDay()!==0&&d.getDay()!==6) return;
    let observed=targetDateAt(year,11,27);
    while(observed.getDay()===0||observed.getDay()===6||out.has(iso(observed))) observed.setDate(observed.getDate()+1);
    add(observed);
  });
  return out;
}
function targetRound(value,unit){
  const n=Number(value||0), u=Math.max(1,Number(unit||10));
  return Math.max(0,Math.round(n/u)*u);
}
function targetDefaultSaturday(key,monthly,site,unit){
  if(site.noSaturday) return 0;
  const d=TARGET_SITE_DEFAULTS[key]||{monthly:1,saturday:0};
  return targetRound((Number(monthly||0)*d.saturday)/d.monthly,Math.max(100,Number(unit||10)));
}
function targetOpeningDays(month,site){
  const [year,monthNumber]=month.split('-').map(Number), monthIndex=monthNumber-1;
  const bankHolidays=targetBankHolidaySet(year), lastDay=new Date(year,monthNumber,0).getDate();
  const days=[];
  for(let day=1;day<=lastDay;day++){
    const date=targetDateAt(year,monthIndex,day), dateStr=iso(date), dow=date.getDay();
    const bankHoliday=bankHolidays.has(dateStr), sunday=dow===0, saturday=dow===6;
    const open=!bankHoliday&&!sunday&&!(saturday&&site.noSaturday);
    days.push({date:dateStr,dow,open,bankHoliday,saturday});
  }
  return days;
}
function targetSuggestedWeekday(month,site,key,monthlyInput,saturdayInput){
  const def=TARGET_SITE_DEFAULTS[key], days=targetOpeningDays(month,site);
  const weekdays=days.filter(d=>d.open&&!d.saturday).length, saturdays=days.filter(d=>d.open&&d.saturday).length;
  if(!weekdays) return 0;
  const monthlyTarget=Math.max(0,Number(monthlyInput)||0), saturdayTarget=site.noSaturday?0:Math.max(0,Number(saturdayInput)||0);
  const average=Math.max(0,(monthlyTarget-(saturdays*saturdayTarget))/weekdays), unit=Math.max(1,Number(def.weekdayRound||10));
  if(def.weekdayMode==='floor') return Math.floor(average/unit)*unit;
  if(def.weekdayMode==='ceil') return Math.ceil(average/unit)*unit;
  return Math.round(average/unit)*unit;
}
function targetBuildSitePlan(month,site,key,monthlyInput,saturdayInput,oldSite,weekdayInput){
  const def=TARGET_SITE_DEFAULTS[key], days=targetOpeningDays(month,site);
  const monthlyTarget=targetRound(monthlyInput,5);
  const saturdayTarget=site.noSaturday?0:targetRound(saturdayInput,5);
  const weekdayTarget=targetRound(weekdayInput??targetSuggestedWeekday(month,site,key,monthlyTarget,saturdayTarget),5);
  days.forEach(day=>{
    const oldDay=(oldSite&&oldSite.days||[]).find(x=>x.date===day.date)||{};
    day.target=day.open?(day.saturday?saturdayTarget:weekdayTarget):null;
    day.actual=oldDay.actual??'';
  });
  const weekdays=days.filter(d=>d.open&&!d.saturday), saturdays=days.filter(d=>d.open&&d.saturday);
  const saturdayTotal=saturdays.length*saturdayTarget;
  if(monthlyTarget<saturdayTotal) throw new Error(`${TARGET_SITE_DEFAULTS[key].label}: Saturday targets exceed the monthly target.`);
  if(!weekdays.length && monthlyTarget!==saturdayTotal) throw new Error(`${TARGET_SITE_DEFAULTS[key].label}: no weekday opening days are available.`);
  if(weekdays.length){
    let remainder=(monthlyTarget-saturdayTotal)-(weekdayTarget*weekdays.length);
    const direction=remainder<0?-1:1, step=Math.max(5,Number(def.balanceStep||10));
    const ordered=def.balanceAt==='last'?[...weekdays].reverse():weekdays;
    let i=0;
    while(Math.abs(remainder)>0.001){
      const amount=Math.min(Math.abs(remainder),step)*direction, day=ordered[i%ordered.length];
      if(day.target+amount<0) throw new Error(`${def.label}: the normal weekday target is too high.`);
      day.target+=amount; remainder-=amount; i++;
      if(i>10000) throw new Error(`${def.label}: daily targets could not be balanced.`);
    }
  }
  const calculated=days.reduce((n,d)=>n+(Number(d.target)||0),0);
  if(Math.abs(calculated-monthlyTarget)>0.001) throw new Error(`${TARGET_SITE_DEFAULTS[key].label}: daily figures do not reconcile to the monthly target.`);
  return {siteId:site.id,siteKey:key,label:def.label,monthlyTarget,saturdayTarget,weekdayTarget,roundTo:5,days,openingDays:days.filter(d=>d.open).length,bankHolidayDates:days.filter(d=>d.bankHoliday).map(d=>d.date)};
}

function bonusMoney(v){
  const n=Number(v||0);
  return Number.isFinite(n) ? '£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}) : '£0.00';
}
function bonusAmount(v){ const n=Number(v||0); return Number.isFinite(n)?n:0; }
function bonusTier(value,start,base){
  value=bonusAmount(value);
  return start!=null && value>=start ? base+(Math.floor((value-start)/5000)*50) : 0;
}
function bonusDavanti(units,target){
  units=bonusAmount(units);
  return units>=target ? 50+Math.max(0,units-target)*2 : 0;
}
function bonusAddOn(snapshot){
  if(!snapshot) return 0;
  const tracking=bonusAmount(snapshot.tracking);
  const trackingPay=Math.min(tracking,50)+(Math.max(0,tracking-50)*2);
  return trackingPay+
    bonusAmount(snapshot.pollen)+
    bonusAmount(snapshot.bfc)+
    bonusAmount(snapshot.diag)+
    bonusAmount(snapshot.coolant)+
    bonusAmount(snapshot.ac);
}
function bonusTonyDavanti(units){
  units=bonusAmount(units);
  return units>=600 ? 100+(Math.floor((units-600)/25)*25) : 0;
}
function bonusNeilTurnover(value){
  value=bonusAmount(value);
  return value>=500000 ? 700+(Math.floor((value-500000)/25000)*25) : 0;
}
function bonusNeilDavanti(units){
  units=bonusAmount(units);
  return units>=550 ? 100+(Math.floor((units-550)/25)*25) : 0;
}
function bonusManagerExtra(emp,siteKey,sales){
  const name=bonusNorm(emp&&emp.name), value=bonusAmount(sales);
  if(siteKey==='middlesbrough' && name==='thope'){
    if(value>=160000) return 600;
    if(value>=150000) return 500;
    if(value>=140000) return 400;
    if(value>=130000) return 300;
    if(value>=120000) return 250;
    if(value>=110000) return 200;
  }
  if(siteKey==='fairfield' && name==='mmccormick'){
    if(value>=100000) return 400;
    if(value>=95000) return 350;
    if(value>=90000) return 300;
    if(value>=85000) return 250;
  }
  if(siteKey==='chester' && name==='sjauncey'){
    if(value>=100000) return 300;
    if(value>=90000) return 200;
    if(value>=80000) return 100;
  }
  if(siteKey==='gateshead' && name==='sgibson'){
    if(value>=140000) return 700;
    if(value>=130000) return 600;
    if(value>=120000) return 500;
    if(value>=110000) return 400;
    if(value>=100000) return 300;
  }
  return 0;
}
function bonusWeekdays(month){
  const parts=String(month||'').split('-').map(Number), y=parts[0], m=parts[1];
  if(!y||!m) return 0;
  let total=0;
  for(let d=new Date(y,m-1,1);d.getMonth()===m-1;d.setDate(d.getDate()+1)) if(d.getDay()>=1&&d.getDay()<=5) total++;
  return total;
}
function bonusSickDays(empId,month){
  return state.absences.filter(a=>{
    if(String(a.employeeId)!==String(empId) || String(a.type||'').toLowerCase()!=='sick' || !String(a.date||'').startsWith(month+'-')) return false;
    const d=fromIso(a.date); return d.getDay()>=1&&d.getDay()<=5;
  }).length;
}
function bonusRole(emp){
  const saved=String(emp.bonusRole||'auto').toLowerCase();
  if(['reception','workshop','none'].includes(saved)) return saved;
  return BONUS_RECEPTION_NAMES.has(bonusNorm(emp.name))?'reception':'workshop';
}
function bonusMonthData(month){
  if(!state.bonusSheets[month]) state.bonusSheets[month]={employees:{},tonyAdjustment:'',neilOwed:''};
  const out=state.bonusSheets[month];
  if(!out.employees) out.employees={};
  return out;
}
function bonusSnapshotsForMonth(month){
  const rows=(state.admin.salesHistory||[]).filter(r=>String(r.snapshot_date||'').startsWith(month+'-') || String(r.period_end||'').startsWith(month+'-'));
  const sorted=rows.slice().sort((a,b)=>String(b.snapshot_date||'').localeCompare(String(a.snapshot_date||'')));
  const found={};
  sorted.forEach(r=>{ const key=bonusSiteKey(r.site_name||r.site_key); if(key&&!found[key]) found[key]=r; });
  return found;
}
function bonusEmployeeCalc(emp,siteCalc,month,draft,receptionCount){
  const role=bonusRole(emp), edit=draft.employees[emp.id]||{};
  const baseOverride=String(edit.baseOverride??'').trim();
  const sickDays=bonusSickDays(emp.id,month), weekdays=bonusWeekdays(month);
  const losesBonus=role!=='none'&&sickDays>2;
  const normalBase=baseOverride===''?siteCalc.staffBonus:bonusAmount(baseOverride);
  const base=losesBonus?0:normalBase;
  const addOn=losesBonus?0:(role==='reception'&&receptionCount?siteCalc.addOnBonus/receptionCount:0);
  const davanti=losesBonus?0:(role==='reception'?siteCalc.davantiBonus:0);
  const sickDeduction=weekdays?base/ weekdays*sickDays:0;
  const damages=bonusAmount(edit.damages), owed=bonusAmount(edit.owed), extra=bonusAmount(edit.extra);
  const managerExtra=losesBonus?0:bonusManagerExtra(emp,siteCalc.siteKey,siteCalc.sales);
  const gross=role==='none'?0:base+addOn+davanti;
  return {role,base,addOn,davanti,sickDays,sickDeduction,damages,owed,extra,managerExtra,losesBonus,total:gross-sickDeduction-damages+owed+extra+managerExtra};
}

  });

/* ============================= UPPER ADMIN PASSWORD VAULT ============================= */
function vaultEsc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function vaultB64(bytes){
  let s=''; bytes=new Uint8Array(bytes);
  for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]);
  return btoa(s);
}
function vaultUnb64(s){
  const raw=atob(String(s||'')); const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
async function vaultDeriveKey(passphrase,salt){
  if(!window.crypto?.subtle) throw new Error('Encrypted vault is not supported by this browser.');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,
    {name:'AES-GCM',length:256},false,['encrypt','decrypt']
  );
}
async function vaultEncryptEntries(entries,key,saltB64){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const plain=new TextEncoder().encode(JSON.stringify(entries));
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);
  return {version:1,salt:saltB64,iv:vaultB64(iv),ciphertext:vaultB64(cipher),updatedAt:Date.now()};
}
async function vaultDecryptEntries(blob,key){
  const plain=await crypto.subtle.decrypt(
    {name:'AES-GCM',iv:vaultUnb64(blob.iv)},key,vaultUnb64(blob.ciphertext)
  );
  const data=JSON.parse(new TextDecoder().decode(plain));
  return Array.isArray(data)?data:[];
}
async function savePasswordVault(){
  if(state.admin.role!=='super' || !state.admin.vaultKey || !Array.isArray(state.admin.vaultEntries)) return false;
  const current=state.config.settings.passwordVault;
  if(!current?.salt) return false;
  state.config.settings.passwordVault=await vaultEncryptEntries(state.admin.vaultEntries,state.admin.vaultKey,current.salt);
  return await saveConfig();
}
async function vaultCopy(text){
  try{
    if(navigator.clipboard?.writeText){ await navigator.clipboard.writeText(text); return true; }
  }catch(_e){}
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  const ok=document.execCommand('copy'); ta.remove(); return ok;
}

function parseCsvLine(line){
  const out=[]; let cur='', quoted=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(quoted && line[i+1]==='"'){ cur+='"'; i++; }
      else quoted=!quoted;
    } else if(ch===',' && !quoted){ out.push(cur.trim()); cur=''; }
    else cur+=ch;
  }
  out.push(cur.trim());
  return out;
}
function parseHolidayImportCsv(text){
  const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const headers=parseCsvLine(lines[0]).map(h=>h.toLowerCase().trim());
  const col=name=>headers.indexOf(name);
  const iWho=col('pin_or_name'), iStart=col('start_date'), iEnd=col('end_date');
  const iStatus=col('status'), iLabel=col('calendar_label'), iSite=col('site');
  if(iWho<0 || iStart<0 || iEnd<0) throw new Error('CSV must contain pin_or_name, start_date and end_date columns.');
  return lines.slice(1).map((line,n)=>{
    const p=parseCsvLine(line);
    return {
      row:n+2, who:p[iWho]||'', start:p[iStart]||'', end:p[iEnd]||'',
      status:iStatus>=0?(p[iStatus]||'approved'):'approved',
      label:iLabel>=0?(p[iLabel]||''):'',
      site:iSite>=0?(p[iSite]||''):''
    };
  }).filter(r=>r.who || r.start || r.end);
}
function holidayImportMatch(row){
  const key=String(row.who||'').trim();
  let emp=(state.config.employees||[]).find(e=>String(e.pin||'').trim()===key);
  if(!emp) emp=(state.config.employees||[]).find(e=>String(e.name||'').trim().toLowerCase()===key.toLowerCase());
  if(!emp && row.label){
    const label=String(row.label).replace(/\s*\([^)]*\)\s*/g,' ').trim().toLowerCase();
    emp=(state.config.employees||[]).find(e=>String(e.name||'').trim().toLowerCase()===label);
  }
  return emp||null;
}
function validIsoDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||'')) && !isNaN(new Date(String(s)+'T12:00:00').getTime()); }

function duplicateHolidaySummary(){
  const seen = new Map();
  let duplicateAmount = 0, affectedDates = 0;
  (Array.isArray(state.requests)?state.requests:[])
    .filter(r=>r && r.status==='approved')
    .sort((a,b)=>(a.requestedAt||0)-(b.requestedAt||0))
    .forEach(r=>{
      (Array.isArray(r.dates)?r.dates:[]).forEach(d=>{
        if(!d) return;
        const date=dateEntryDate(d), amount=dateEntryAmount(d);
        if(!date) return;
        const key=r.employeeId+'|'+date;
        const prev=seen.get(key)||0;
        const next=prev+amount;
        if(next>1){
          duplicateAmount += Math.min(amount, next-1);
          if(prev<=1) affectedDates++;
        }
        seen.set(key,next);
      });
    });
  return {duplicateAmount, affectedDates};
}
function cleanDuplicateApprovedHolidays(){
  // Preserve the oldest approved holiday coverage first. Any later overlap is
  // removed or reduced so an employee can never exceed one day on a date.
  const used = new Map();
  let removedAmount = 0, changedRequests = 0, removedRequests = 0;
  const ordered = (Array.isArray(state.requests)?state.requests:[])
    .map((r,index)=>({r,index}))
    .sort((a,b)=>((a.r.requestedAt||a.r.decidedAt||0)-(b.r.requestedAt||b.r.decidedAt||0)) || a.index-b.index);

  for(const item of ordered){
    const r=item.r;
    if(!r || r.status!=='approved' || !Array.isArray(r.dates)) continue;
    const cleaned=[];
    let changed=false;
    for(const d of r.dates){
      if(!d){ changed=true; continue; }
      const date=dateEntryDate(d);
      const amount=Math.max(0, Math.min(1, dateEntryAmount(d)));
      if(!date || amount<=0){ changed=true; continue; }
      const key=r.employeeId+'|'+date;
      const already=used.get(key)||0;
      const keep=Math.max(0, Math.min(amount, 1-already));
      if(keep<=0){
        removedAmount += amount;
        changed=true;
        continue;
      }
      if(keep < amount){
        removedAmount += (amount-keep);
        changed=true;
      }
      cleaned.push(keep===1 && typeof d==='string' ? d : {date,amount:keep});
      used.set(key, Math.min(1, already+keep));
    }
    if(changed){
      r.dates=cleaned;
      changedRequests++;
    }
  }

  const before=state.requests.length;
  state.requests=state.requests.filter(r=>!(r && r.status==='approved' && Array.isArray(r.dates) && r.dates.length===0));
  removedRequests=before-state.requests.length;
  return {removedAmount, changedRequests, removedRequests};
}

  <div id="balance-sheet-output">${renderBalanceSheet()}</div>`;
}

function renderBalanceSheet(){
  const isSuper = state.admin.role==='super';
  const asOf = state.admin.balAsOf;
  if(!asOf) return `<div class="empty-state">Pick a date.</div>`;
  const siteFilter = isSuper ? (state.admin.balSheetSite||'all') : state.admin.scopeSite;
  const asOfLabel = fmtDate(asOf);

  if(siteFilter==='all'){
    // One single portable page for every active employee across every site.
    const emps = state.config.employees.filter(e=>e.active!==false)
      .sort((a,b)=> siteName(a.siteId).localeCompare(siteName(b.siteId)) || a.name.localeCompare(b.name));
    if(!emps.length) return `<div class="empty-state">No active employees.</div>`;
    const rows = emps.map(emp=>{
      const bal = availableBalance(emp, asOf);
      const u = unitLabel(emp);
      return `<tr><td class="att-name">${emp.name}</td><td style="text-align:left;">${siteName(emp.siteId)}</td><td>${formatHolidayAmount(emp,emp.allowanceDays||20)} ${u}/yr</td><td style="${bal<0?'color:#b3261e;':''}">${bal.toFixed(2)} ${u}</td></tr>`;
    }).join('');
    return `
    <div class="att-sheet">
      <div class="att-title-row"><img class="att-logo" src="${LOGO_DATA_URI}" alt="holiday balances"><span>HOLIDAY ALLOWANCE — ALL STAFF</span></div>
      <div class="att-meta-row"><span>As of ${asOfLabel}</span><span class="site-tag">${emps.length} people</span></div>
      <div class="att-table-wrap">
      <table class="att-table">
        <thead><tr><th style="text-align:left;">Name</th><th style="text-align:left;">Site</th><th>Entitlement</th><th>Balance</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>`;
  }

  // A single site chosen (or a site manager's own site) — one page, that site only.
  const site = state.config.sites.find(s=>s.id===siteFilter);
  if(!site) return `<div class="empty-state">No active employees.</div>`;
  const emps = state.config.employees.filter(e=>e.siteId===site.id && e.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  if(!emps.length) return `<div class="empty-state">No active employees.</div>`;
  const rows = emps.map(emp=>{
    const bal = availableBalance(emp, asOf);
    const u = unitLabel(emp);
    return `<tr><td class="att-name">${emp.name}</td><td>${formatHolidayAmount(emp,emp.allowanceDays||20)} ${u}/yr</td><td style="${bal<0?'color:#b3261e;':''}">${bal.toFixed(2)} ${u}</td></tr>`;
  }).join('');
  return `
  <div class="att-sheet">
    <div class="att-title-row"><img class="att-logo" src="${LOGO_DATA_URI}" alt="holiday balances"><span>HOLIDAY BALANCES</span></div>
    <div class="att-meta-row"><span>As of ${asOfLabel}</span><span class="site-tag">${site.name}</span></div>
    <div class="att-table-wrap">
    <table class="att-table">
      <thead><tr><th style="text-align:left;">Name</th><th>Entitlement</th><th>Balance</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  </div>`;
}

function renderHolidaySheet(){
  const isSuper = state.admin.role==='super';
  const from = state.admin.holFrom, to = state.admin.holTo;
  if(!from || !to) return `<div class="empty-state">Pick a from and to date.</div>`;
  const siteFilter = isSuper ? (state.admin.holSheetSite||'all') : state.admin.scopeSite;
  const sitesToShow = siteFilter==='all' ? state.config.sites : state.config.sites.filter(s=>s.id===siteFilter);
  const rangeLabel = `${fmtDate(from)} – ${fmtDate(to)}`;

  let sheets = '';
  sitesToShow.forEach(site=>{
    const emps = state.config.employees.filter(e=>e.siteId===site.id).sort((a,b)=>a.name.localeCompare(b.name));
    const rows = [];
    emps.forEach(emp=>{
      const datesInRange = state.requests
        .filter(r=>r.employeeId===emp.id && r.status==='approved')
        .flatMap(r=>r.dates)
        .filter(d=>dateEntryDate(d)>=from && dateEntryDate(d)<=to)
        .sort((a,b)=>dateEntryDate(a)<dateEntryDate(b)?-1:1);
      if(!datesInRange.length) return;
      const totalHoliday = datesInRange.reduce((sum,d)=>sum+dateEntryAmount(d),0);
      const dateLabels = datesInRange.map(d=>{
        const amount=dateEntryAmount(d);
        return fmtDateShort(dateEntryDate(d))+(isHourly(emp)?` (${formatHolidayAmount(emp,amount)} hrs)`:(amount===0.5?' (½)':''));
      }).join(', ');
      rows.push(`<tr><td class="att-name">${emp.name}</td><td style="text-align:left;">${dateLabels}</td><td>${formatHolidayAmount(emp,totalHoliday)} ${unitLabel(emp)}</td></tr>`);
    });
    if(!rows.length) return;
    sheets += `
    <div class="att-sheet">
      <div class="att-title-row"><img class="att-logo" src="${LOGO_DATA_URI}" alt="holiday sheet"><span>HOLIDAY SHEET</span></div>
      <div class="att-meta-row"><span>${rangeLabel}</span><span class="site-tag">${site.name}</span></div>
      <div class="att-table-wrap">
      <table class="att-table">
        <thead><tr><th style="text-align:left;">Name</th><th style="text-align:left;">Dates</th><th>Total</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
      </div>
    </div>`;
  });
  return sheets || `<div class="empty-state">No approved holiday in this range.</div>`;
}

function renderApproveModal(){
  const r = state.requests.find(x=>x && x.id===state.admin.pendingApprove);
  if(!r) return '';
  const emp = employeeById(r.employeeId);
  const safeDates = Array.isArray(r.dates) ? r.dates.filter(Boolean) : [];
  if(!safeDates.length){
    return `<div class="modal-overlay" data-modal-overlay="1"><div class="modal">
      <h3>Holiday request cannot be approved</h3>
      <div class="error-msg">This request has no valid holiday dates. Delete it and ask the employee to submit it again.</div>
      <div class="modal-actions"><button type="button" class="action-btn secondary" data-action="close-modal">Close</button></div>
    </div></div>`;
  }
  const conflicts = safeDates.map(d=>dateEntryDate(d)).filter(Boolean).map(d=>({date:d, count: offCountForDate(d)})).filter(x=>x.count+1 > state.config.settings.capOff);
  const holidayAmount = requestDayCount({dates:safeDates});
  const unit = emp ? unitLabel(emp) : 'days';
  const projectedBalance = emp ? availableBalance(emp) - holidayAmount : 0;
  return `<div class="modal-overlay" data-modal-overlay="1">
    <div class="modal">
      <h3>Approve holiday — ${emp?emp.name:''}</h3>
      <div style="font-size:13px;color:var(--muted);">${fmtDateShort(dateEntryDate(safeDates[0]))} – ${fmtDateShort(dateEntryDate(safeDates[safeDates.length-1]))} · ${emp?formatHolidayAmount(emp,holidayAmount):holidayAmount} ${unit}</div>
      ${holidayCoverName(r)?`<div style="font-size:13px;color:var(--text);margin-top:6px;"><b>Shift cover:</b> ${salesHtml(holidayCoverName(r))}</div>`:''}
      ${r.status==='recommended'
        ? `<div style="font-size:13px;color:var(--green);margin-top:6px;">Recommended by ${r.recommendedBy||'the site manager'}.</div>`
        : `<div class="conflict-box">The site manager hasn't reviewed this yet. You can still authorise it, but it hasn't been through them.</div>`}
      ${conflicts.length ? `<div class="conflict-box">
        Approving this pushes the company over the cap of ${state.config.settings.capOff} on: ${conflicts.map(c=>fmtDateShort(c.date)+' ('+(c.count+1)+' off)').join(', ')}.
      </div>` : ''}
      ${projectedBalance<0 ? `<div class="conflict-box">
        This takes ${emp.name}'s balance to ${projectedBalance.toFixed(2)} ${unit} — negative. That's allowed with approval, but they'll owe the difference back against future accrual.
      </div>` : ''}
      <div class="modal-actions">
        <button type="button" class="action-btn ${(conflicts.length||projectedBalance<0)?'danger':''}" data-action="confirm-approve" data-id="${r.id}">${(conflicts.length||projectedBalance<0)?'Approve anyway':'Approve'}</button>
        <button type="button" class="action-btn secondary" data-action="close-modal">Cancel</button>
      </div>
    </div>
  </div>`;
}


function removeApprovedHolidayDate(empId, dateStr){
  let removed=0;
  for(const r of (Array.isArray(state.requests)?state.requests:[])){
    if(!r || r.status!=='approved' || r.employeeId!==empId || !Array.isArray(r.dates)) continue;
    const kept=[];
    for(const d of r.dates){
      if(d && dateEntryDate(d)===dateStr){ removed += dateEntryAmount(d); }
      else kept.push(d);
    }
    r.dates=kept;
  }
  state.requests=state.requests.filter(r=>!(r && r.status==='approved' && Array.isArray(r.dates) && r.dates.length===0));
  return removed;
}

function renderAdminCalendar(){
  const m = state.admin.calMonth;
  const year = m.getFullYear(), month = m.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Monday=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(new Date(year,month,d));
  while(cells.length%7!==0) cells.push(null);

  const isSuper = state.admin.role==='super';
  const siteOptions = `<option value="all">All sites</option>` + state.config.sites.map(s=>`<option value="${s.id}" ${state.admin.calSite===s.id?'selected':''}>${s.name}</option>`).join('');
  const effectiveSite = isSuper ? state.admin.calSite : state.admin.scopeSite;

  const dow = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const cellsHtml = cells.map(d=>{
    if(!d) return `<div class="cal-cell other-month"></div>`;
    const dateStr = iso(d);
    const classes = ['cal-cell'];
    if(dateStr===iso(new Date())) classes.push('today');
    if(isSunday(d)) classes.push('sunday');
    if(isSaturday(d)) classes.push('saturday');
    if(isBankHoliday(dateStr)) classes.push('bh');
    const covering = approvedEmployeeEntriesForDate(dateStr);
    const count = covering.length;
    const filtered = effectiveSite==='all' ? covering : covering.filter(x=>{
      const e = employeeById(x.employeeId); return e && e.siteId===effectiveSite;
    });
    const chips = filtered.map(x=>{
      const e = employeeById(x.employeeId);
      const amt = x.amount;
      if(!e) return '';
      const initials=e.name.split(' ').map(w=>w[0]).join('').slice(0,2);
      if(isSuper){
        return `<span class="cal-chip cal-editable" data-action="calendar-remove-holiday" data-emp="${e.id}" data-date="${dateStr}" style="background:${siteCalendarColour(e.siteId)}" title="Remove ${e.name} from ${fmtDate(dateStr)}">${initials}${amt===0.5?'½':''}</span>`;
      }
      return `<span class="cal-chip" style="background:${siteCalendarColour(e.siteId)}" title="${e.name} · ${siteName(e.siteId)}">${initials}${amt===0.5?'½':''}</span>`;
    }).join('');
    return `<div class="${classes.join(' ')}">
      ${isSuper ? `<button type="button" class="cal-add-btn" data-action="calendar-add-holiday" data-date="${dateStr}" title="Add holiday on ${fmtDate(dateStr)}">+</button>` : ''}
      <div class="cal-date">${d.getDate()}</div>
      ${chips ? `<div class="cal-chips">${chips}</div>` : ''}
      ${count>0 ? `<div class="cal-count ${count>=state.config.settings.capOff?'full':''}">${count}/${state.config.settings.capOff}</div>` : ''}
    </div>`;
  }).join('');

  return `
  <h2>Calendar</h2>
  <div class="head-sub">Who's off${isSuper?', by site':' at '+siteName(state.admin.scopeSite)}. Counts shown are company-wide against the cap.${isSuper?' Use + to add a holiday; click a staff chip to remove that date.':''}</div>
  <div class="cal-toolbar">
    <button type="button" data-action="cal-prev">←</button>
    <div class="cal-month-label">${m.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</div>
    <button type="button" data-action="cal-next">→</button>
    ${isSuper ? `<select id="cal-site-select">${siteOptions}</select>` : ''}
  </div>
  <div class="site-colour-legend">
    ${(effectiveSite==='all' ? state.config.sites : state.config.sites.filter(s=>s.id===effectiveSite)).map(s=>
      `<span><i class="site-colour-dot" style="background:${siteCalendarColour(s.id)}"></i>${s.name}</span>`
    ).join('')}
  </div>

  <div class="cal-grid">
    ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cellsHtml}
  </div>
  <div class="legend">
    <span><i style="background:#211f1a;"></i>Saturday (worked, no holiday)</span>
    <span><i style="background:#201d1d;"></i>Sunday (closed)</span>
    <span><i style="background:var(--red-dim);"></i>Bank holiday</span>
  </div>`;
}

function renderAdminTimesheets(){
  const weekStart = weekStartMonday(state.admin.tsWeek);
  const weekIso = iso(weekStart);
  const days = Array.from({length:7},(_,i)=>{ const d=new Date(weekStart); d.setDate(d.getDate()+i); return d; });
  const dayLabels = ['MON','TUES','WED','THUR','FRI','SAT','SUN'];
  const shiftsMap = computeAllShifts();
  const extras = getWeekExtras(weekIso);
  const isSuper = state.admin.role==='super';
  const weekLocked = isTimesheetWeekLocked(weekIso);
  const lockInfo = timesheetLockInfo(weekIso);
  const siteOptions = state.config.sites.map(s=>`<option value="${s.id}" ${state.admin.tsSite===s.id?'selected':''}>${s.name}</option>`).join('');
  let effectiveSite = isSuper ? state.admin.tsSite : state.admin.scopeSite;
  // One site at a time. Rendering every site's editable sheet together builds
  // thousands of form fields and can crash the browser.
  if(effectiveSite==='all'){
    const first = (state.config.sites||[])[0];
    if(first){ state.admin.tsSite = first.id; effectiveSite = first.id; }
  }
  const sitesToShow = state.config.sites.filter(s=>s.id===effectiveSite);
  const weekBeginningLabel = weekStart.toLocaleDateString('en-GB',{day:'numeric',month:'numeric',year:'numeric'});
  const companyName = (state.config.settings.companyName || 'ATTENDANCE SHEET').toUpperCase();

  let sheets = '';
  sitesToShow.forEach(site=>{
    const weekDateSet = new Set(days.map(d=>iso(d)));
    const sevenDay = isSevenDaySite(site.id);
    // Payroll follows the person, not the building: someone based here who
    // spends a day at another site still belongs on this sheet.
    const emps = state.config.employees
      .filter(e=>e.siteId===site.id && e.active!==false)
      .sort((a,b)=>timesheetEmployeeCompare(site.id,a,b));

    const rows = emps.map(emp=>{
      const empData = shiftsMap[emp.id] || {shifts:[], openShift:null};
      const isVisitor = false;
      const holDates = approvedDatesForEmployee(emp.id);
      const empExtras = extras.employees[emp.id] || {};
      const hoursOverride = empExtras.hoursOverride || {};
      let weekTotal = 0, satHours = 0, holCount = 0;
      const dayCells = days.map((d,i)=>{
        const dateStr = iso(d);
        const isHol = holDates.has(dateStr) && !isVisitor; // holiday only marked on home sheet
        const pendingHol = !isHol && !isVisitor ? pendingHolidayFor(emp.id,dateStr) : null;
        const holAmt = isHol ? (holDates.get(dateStr)||1) : 0;
        const dayShifts = empData.shifts
          .filter(s=>s.date===dateStr)
          .sort((a,b)=>a.inTs-b.inTs);
        // Note if any of it was worked away from their own site.
        const awayAt = dayShifts
          .map(s=>shiftSite(s,emp))
          .filter(sid=>sid && sid!==site.id);
        const hasAutoClosed = dayShifts.some(s=>s.autoClosed);
        const dow = d.getDay();
        const computedHours = paidHoursForDay(dayShifts,dateStr,site.id,emp);
        const hasOverride = !isVisitor && hoursOverride[dateStr]!==undefined && hoursOverride[dateStr]!=='';
        const dayHours = hasOverride ? normaliseTimesheetHours(parseFloat(hoursOverride[dateStr])||0,emp,site.id) : computedHours;
        if(isHol) holCount += holAmt;
        if(!sevenDay && i===5) satHours += dayHours; // Sat = overtime, standard sites only
        else weekTotal += dayHours; // everything else counts (all 7 days for seven-day sites)
        let content;
        if(isHol) content = `<span class="att-hol">${isHourly(emp)?formatTimesheetHours(holAmt,emp,site.id)+'h Hol':(holAmt===0.5?'½ Hol':'Hol')}</span>`;
        else if(dow===0 && !sevenDay && dayHours===0){
          content = `<span style="color:#999;font-style:italic;">Closed</span>`;
        }
        else if(dow!==0 || sevenDay){
          // Every working day takes typed hours, whether or not anyone clocked
          // in — otherwise past days could never be filled in by hand.
          const hrsBox = `<input type="text" inputmode="decimal" class="hrs-input${hasOverride?' hrs-overridden':''}${(hasAutoClosed && !hasOverride)?' hrs-estimated':''}" data-hrs-emp="${emp.id}" data-hrs-date="${dateStr}" value="${dayHours>0?formatTimesheetHours(dayHours,emp,site.id):''}" placeholder="–" ${weekLocked?'disabled':''}>`;
          // The absence dropdown sits underneath, but only when no hours are
          // recorded — you can't be both working and absent the same day.
          const abs = absenceFor(emp.id, dateStr);
          const absType = abs ? abs.type : '';
          const isFuture = dateStr > iso(new Date());
          const absBox = (isFuture || (dayHours>0 && !absType)) ? '' : `<select class="abs-select ${absType?'abs-'+absType:''}" data-abs-emp="${emp.id}" data-abs-date="${dateStr}" ${weekLocked?'disabled':''} style="margin-top:3px;">
            <option value="">–</option>
            <option value="sick" ${absType==='sick'?'selected':''}>Sick</option>
            <option value="authorised" ${absType==='authorised'?'selected':''}>Authorised</option>
            <option value="unauthorised" ${absType==='unauthorised'?'selected':''}>Unauth.</option>
          </select>`;
          content = hrsBox + absBox;
        }
        else content = '';
        const pendingMark = pendingHol ? `<span class="att-pending-hol" title="Holiday requested — awaiting approval">⏳</span>` : '';
        const awayNote = awayAt.length ? 'Worked at ' + [...new Set(awayAt.map(siteName))].join(', ') + ' this day. ' : '';
        const awayMark = awayAt.length ? `<span title="Worked at ${[...new Set(awayAt.map(siteName))].join(', ')}" style="color:#6b4fc9;font-size:9px;vertical-align:super;">△</span>` : '';
        return `<td title="${pendingHol ? 'Holiday requested — awaiting approval. ' : ''}${(dow===0 && !sevenDay && dayHours>0) ? 'Closed — but a clock event exists this day, worth checking. ' : ''}${awayNote}${hasAutoClosed ? 'Never clocked out — automatically closed at the applicable site cut-off. Correct it here if wrong. ' : ''}${dayShifts.some(s=>s.managerEntered) ? 'Time entered or corrected by a manager. ' : ''}${dayShifts.map(s=>timeOnly(s.inTs)+'–'+timeOnly(s.outTs)+(s.autoClosed?' (auto)':'')).join(', ')}">${content}${pendingMark}${awayMark}</td>`;
      }).join('');

      const overtimeVal = empExtras.overtime !== undefined && empExtras.overtime !== '' ? formatTimesheetHours(empExtras.overtime,emp,site.id) : (satHours>0 ? formatTimesheetHours(satHours,emp,site.id) : '');
      const holsVal = empExtras.hols !== undefined && empExtras.hols !== ''
        ? (isHourly(emp) ? formatTimesheetHours(empExtras.hols,emp,site.id) : empExtras.hols)
        : (holCount>0 ? (isHourly(emp) ? formatTimesheetHours(holCount,emp,site.id) : holCount) : '');
      const sickVal = empExtras.sick !== undefined ? empExtras.sick : '';

      return `<tr>
        <td class="att-name">${emp.name}${isVisitor?` <span style="font-weight:400;font-style:italic;color:#666;">(visiting)</span>`:''}</td>
        ${dayCells}
        <td><b>${weekTotal>0?formatTimesheetHours(weekTotal,emp,site.id):''}</b></td>
        <td><input type="text" inputmode="decimal" data-ts-field="overtime" data-ts-emp="${emp.id}" value="${overtimeVal}" ${weekLocked?'disabled':''}></td>
        <td><input type="text" data-ts-field="hols" data-ts-emp="${emp.id}" value="${holsVal}" ${weekLocked?'disabled':''}></td>
        <td><input type="text" data-ts-field="sick" data-ts-emp="${emp.id}" value="${sickVal}" ${weekLocked?'disabled':''}></td>
      </tr>`;
    }).join('');

    const noteVal = extras.notes[site.id] || '';

    sheets += `
    <div class="att-sheet">
      <div class="att-title-row"><img class="att-logo" src="${LOGO_DATA_URI}" alt="${companyName}"><span>ATTENDANCE SHEET</span></div>
      <div class="att-meta-row"><span>WEEK BEGINNING ${weekBeginningLabel}</span><span class="site-tag">${site.name}</span></div>
      <div class="att-table-wrap">
      <table class="att-table">
        <thead>
          <tr><th style="text-align:left;">DATES</th>${days.map(d=>`<th>${d.getDate()}-${d.toLocaleDateString('en-GB',{month:'short'})}</th>`).join('')}<th></th><th></th><th></th><th></th></tr>
          <tr><th style="text-align:left;">NAME</th>${dayLabels.map(l=>`<th>${l}</th>`).join('')}<th>TOTAL</th><th>O/TIME</th><th>HOLS</th><th>SICK</th></tr>
        </thead>
        <tbody>
          ${rows || `<tr><td colspan="12" style="padding:14px;color:#666;">No active employees at this site.</td></tr>`}
        </tbody>
      </table>
      </div>
      <table class="att-table att-other-info"><tr>
        <td style="width:100%;">
          <label>ANY OTHER INFO:</label>
          <textarea data-ts-note-site="${site.id}" ${weekLocked?'disabled':''}>${noteVal}</textarea>
        </td>
      </tr></table>
      <div class="att-footnote">ON A DAILY BASIS ENTER: HOLIDAYS, SICKNESS, OVERTIME, UNPAID, TRAINING ETC.</div>
    </div>`;
  });

  return `
  <h2>Timesheets</h2>

function holidayStatusLabel(emp){
  const todayStr = iso(new Date());
  const map = approvedDatesForEmployee(emp.id);
  if(map.has(todayStr)){
    return map.get(todayStr)===0.5 ? 'On holiday (½ day)' : 'On holiday today';
  }
  const upcoming = [...map.keys()].filter(d=>d>todayStr).sort();
  if(upcoming.length) return 'Next: '+fmtDateShort(upcoming[0]);
  return '—';
}

function renderAdminClockLog(){
  const isSuper = state.admin.role==='super';
  const siteOptions = `<option value="all">All sites</option>` + state.config.sites.map(s=>`<option value="${s.id}" ${state.admin.clogSite===s.id?'selected':''}>${s.name}</option>`).join('');
  const effectiveSite = isSuper ? state.admin.clogSite : state.admin.scopeSite;
  const evs = state.events
    .filter(ev=>{
      const emp=employeeById(ev.employeeId);
      const evSite = ev.siteId || (emp ? emp.siteId : null);
      return emp && (effectiveSite==='all' || evSite===effectiveSite);
    })
    .slice().sort((a,b)=>b.timestamp-a.timestamp).slice(0,150);
  const rows = evs.map(ev=>{
    const emp = employeeById(ev.employeeId);
    const evSite = ev.siteId || (emp ? emp.siteId : null);
    const isVisitor = emp && evSite !== emp.siteId;
    return `<tr>
      <td>${emp?emp.name:'—'}</td>
      <td>${siteName(evSite)}${isVisitor?` <span style="color:var(--muted-2);font-size:11px;">(visiting)</span>`:''}</td>
      <td><span class="pill ${ev.type==='in'?'pill-approved':'pill-rejected'}">${ev.type==='in'?'Clocked in':'Clocked out'}</span></td>
      <td class="mono">${fmtTime(ev.timestamp)}</td>
      <td>${state.admin.clockPhotos && state.admin.clockPhotos[ev.id]
        ? `<img src="${state.admin.clockPhotos[ev.id]}" alt="clock-in photo" data-action="view-clock-photo" data-id="${ev.id}" style="height:46px;border-radius:3px;border:1px solid var(--line);display:block;cursor:pointer;" title="Tap to enlarge">`
        : '<span style="color:var(--muted-2);font-size:11px;">—</span>'}</td>
    </tr>`;
  }).join('');
  // Storage gauge — Supabase free tier allows 500MB, so this is now about
  // keeping the data tidy rather than avoiding a cliff edge.
  const approxBytes = JSON.stringify({config:state.config, holidayRequests:state.requests, clockEvents:state.events, timesheetExtras:state.timesheetExtras, absences:state.absences}).length;
  const CAP_BYTES = 500000000;
  const pctUsed = Math.min(100, (approxBytes/CAP_BYTES)*100);
  const pctLabel = pctUsed < 0.1 ? 'under 0.1' : pctUsed.toFixed(1);
  const gaugeColour = pctUsed>=80 ? 'var(--red)' : (pctUsed>=60 ? 'var(--amber)' : 'var(--green)');
  const sizeLabel = approxBytes > 1000000 ? (approxBytes/1000000).toFixed(1)+' MB' : Math.round(approxBytes/1000)+' KB';
  const allEvents = Array.isArray(state.events)?state.events:[];
  const oldestEvent = allEvents.length ? allEvents.reduce((min,e)=> e.timestamp<min.timestamp?e:min, allEvents[0]) : null;
  const defaultCutoff = iso(new Date(new Date().getFullYear(), new Date().getMonth()-3, 1));

  return `
  <h2>Clock Log</h2>
  <div class="head-sub">The raw in/out record. Mostly you won't need it — the tools below are for backing up and tidying old data.</div>
  <details ${state.admin.clogOpen?'open':''} style="margin-bottom:8px;">
    <summary style="cursor:pointer;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);font-size:14px;">
      Show the last 150 clock events${state.config.settings.clockPhotos?' (with photos)':''}
    </summary>
    <div style="margin-top:12px;">
      ${isSuper ? `<div class="cal-toolbar"><select id="clog-site-select">${siteOptions}</select></div>` : ''}
      <div class="card" style="margin-bottom:0;"><table>
        <thead><tr><th>Employee</th><th>Site</th><th>Event</th><th>Time</th><th>Photo</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5" class="empty-state">No clock events yet.</td></tr>`}</tbody>
      </table></div>
    </div>
  </details>

  ${isSuper ? `
  <h2 style="font-size:16px;margin-top:28px;">Storage &amp; archiving</h2>
  <div class="head-sub">There is plenty of room now, so archiving is about keeping records tidy rather than avoiding running out. Download old data as spreadsheets for your files, then optionally clear it.</div>
  <div class="card">
    <div style="margin-bottom:6px;font-size:13px;color:var(--muted);">Storage used: <b style="color:${gaugeColour};">${sizeLabel}</b> of 500 MB (${pctLabel}%) · ${allEvents.length} clock event${allEvents.length===1?'':'s'} stored${oldestEvent?` · oldest from ${fmtDateShort(iso(new Date(oldestEvent.timestamp)))}`:''}</div>
    <div style="height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin-bottom:16px;">
      <div style="height:100%;width:${Math.max(pctUsed,0.5)}%;background:${gaugeColour};"></div>
    </div>
    ${pctUsed>=70 ? `<div class="conflict-box" style="margin-bottom:14px;">Storage is getting full — worth archiving soon.</div>` : ''}
    <div class="field" style="max-width:260px;"><label>Archive everything before this date</label><input type="date" id="archive-before-date" value="${defaultCutoff}"></div>
    <div style="font-size:13px;color:var(--muted);margin:14px 0 8px;"><b>Do these in order.</b> Steps 1 and 2 save your records; only then does step 3 free up space.</div>
    <div class="form-row">
      <button type="button" class="add-btn" data-action="download-timesheet-archive">1. Download timesheets CSV</button>
      <button type="button" class="add-btn" data-action="download-archive">2. Download clock events CSV</button>
      <button type="button" class="add-btn" data-action="clear-archived" style="border-color:var(--red);color:var(--red);">3. Clear old data</button>
    </div>
    <div style="font-size:12px;color:var(--muted-2);">Timesheets are worked out from clock events, so export them <b>before</b> clearing — once the events are gone the old timesheets cannot be rebuilt. Open both files and check they look right first; clearing cannot be undone.</div>
    <div id="archive-result" style="margin-top:10px;font-size:13px;color:var(--muted);"></div>
  </div>

  <h2 style="font-size:16px;margin-top:28px;">Backup &amp; restore</h2>
  <div class="head-sub">Download a complete copy of everything — staff, PINs, holidays, balances, clock events, timesheets. Keep it somewhere safe. If anything is ever lost or wrongly overwritten, the same file puts it all back.</div>
  <div class="card">
    <div class="form-row">
      <button type="button" class="add-btn" data-action="download-backup">Download full backup</button>
      <div class="field"><label>Restore from a backup file</label><input type="file" id="restore-file" accept=".json"></div>
      <button type="button" class="add-btn" data-action="restore-backup" style="border-color:var(--red);color:var(--red);">Restore</button>
    </div>
    <div style="font-size:12px;color:var(--muted-2);">Restoring replaces everything currently in the system with the contents of the file. It asks you to confirm first, and automatically downloads a copy of the current data before it overwrites anything.</div>
    <div id="backup-result" style="margin-top:10px;font-size:13px;color:var(--muted);"></div>
  </div>

  <h2 style="font-size:16px;margin-top:28px;">One-off: import from old storage</h2>
  <div class="head-sub">Only needed once, when moving from the old jsonbin storage to the new database. Copies staff, holidays, clock events, timesheets and absences across. Anything already here is overwritten, so do this before entering new data.</div>
  <div class="card">
    <button type="button" class="add-btn" data-action="migrate-from-jsonbin">Import everything from jsonbin</button>
    <div id="migrate-result" style="margin-top:10px;font-size:13px;color:var(--muted);"></div>
  </div>` : ''}`;
}

/* ============================= TOAST ============================= */
let toastTimer=null;
function showToast(msg, isErr){
  let t = document.querySelector('.toast');
  if(t) t.remove();
  t = document.createElement('div');
  t.className = 'toast'+(isErr?' err':'');
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 3000);
}

/* ============================= EVENT HANDLERS ============================= */
function attachHandlers(){
  // Handlers are delegated from #app so buttons keep working after every render.
  // This is especially reliable on phones/tablets where the DOM is frequently replaced.
  if(!app.dataset.delegated){
    app.addEventListener('click', async (e)=>{
      const pinEl = e.target.closest('[data-pin-key]');
      if(pinEl && app.contains(pinEl)){
        e.preventDefault();
        await handlePinKey(pinEl.dataset.pinKey);
        return;
      }
      const actionEl = e.target.closest('[data-action]');
      if(actionEl && app.contains(actionEl)){
        e.preventDefault();
        try{
          await onAction({currentTarget: actionEl});
        }catch(err){
          console.error('Shift Board action failed:', actionEl.dataset.action, err);
          showToast('Action failed: '+(err && err.message ? err.message : 'unknown error'), true);
        }
      }
    });
    app.addEventListener('change', (e)=>{
      const permissionUser=e.target.closest('#permission-user');
      if(permissionUser&&app.contains(permissionUser)){
        const email=String(permissionUser.value||'').trim().toLowerCase();
        if(email&&email!==state.admin.permissionEmail){
          state.admin.permissionEmail=email;
          render();
        }
      }
    });
    app.dataset.delegated = '1';
  }
  app.querySelectorAll('[data-admin-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const tab=el.dataset.adminTab;
      if(tab!=='access'&&!canAccessAdminTab(tab)){ showToast('You do not have permission for this page.',true); return; }
      if(tab==='access'&&!isTonyLogin()){ showToast('Only Tony can manage permissions.',true); return; }
      state.admin.tab=tab; render();
    });
  });
  app.querySelectorAll('[data-modal-overlay]').forEach(overlay=>{
    overlay.addEventListener('click', (e)=>{
      if(e.target===overlay){
        state.admin.pendingApprove=null;
        state.admin.editingEmployee=null;
        state.admin.editingSiteManager=null;
        state.admin.editingAdmin=null;
        state.admin.calendarAddDate=null;
        state.admin.viewingClockPhoto=null;
        render();
      }
    });
  });


  const hs = document.getElementById('hol-start');
  const he = document.getElementById('hol-end');
  if(hs) hs.addEventListener('change', ()=>{ state.flow.holStart = hs.value; state.flow.holHalfStart=false; state.flow.holHalfEnd=false; state.flow.holHoursByDate={}; render(); });
  if(he) he.addEventListener('change', ()=>{ state.flow.holEnd = he.value; state.flow.holHalfStart=false; state.flow.holHalfEnd=false; state.flow.holHoursByDate={}; render(); });
  const hhs = document.getElementById('hol-half-start');
  if(hhs) hhs.addEventListener('change', ()=>{ state.flow.holHalfStart = hhs.checked; render(); });
  const hhe = document.getElementById('hol-half-end');
  if(hhe) hhe.addEventListener('change', ()=>{ state.flow.holHalfEnd = hhe.checked; render(); });
  const holCoverEmployee = document.getElementById('hol-cover-employee');
  if(holCoverEmployee) holCoverEmployee.addEventListener('change', ()=>{ state.flow.holCoverEmployeeId=holCoverEmployee.value; render(); });
  app.querySelectorAll('[data-hol-hours-date]').forEach(input=>{
    input.addEventListener('change', ()=>{
      if(!state.flow.holHoursByDate) state.flow.holHoursByDate={};
      const value=Math.max(0.5,Math.min(24,parseFloat(input.value)||8));
      state.flow.holHoursByDate[input.dataset.holHoursDate]=value;
      render();
    });
  });

  const siteSel = document.getElementById('cal-site-select');
  if(siteSel) siteSel.addEventListener('change', ()=>{ state.admin.calSite = siteSel.value; render(); });

  const tsSiteSel = document.getElementById('ts-site-select');
  if(tsSiteSel) tsSiteSel.addEventListener('change', ()=>{ state.admin.tsSite = tsSiteSel.value; render(); });

  const regSiteSel = document.getElementById('reg-site-select');
  if(regSiteSel) regSiteSel.addEventListener('change', ()=>{ state.admin.regSite = regSiteSel.value; render(); });

  const salesRangeSiteSel = document.getElementById('sales-range-site-select');
  if(salesRangeSiteSel) salesRangeSiteSel.addEventListener('change', ()=>{ state.admin.salesRangeSite = salesRangeSiteSel.value; render(); });
  const salesRangeFrom = document.getElementById('sales-range-from');
  if(salesRangeFrom) salesRangeFrom.addEventListener('change', ()=>{ state.admin.salesRangeFrom = salesRangeFrom.value; render(); });
  const salesRangeTo = document.getElementById('sales-range-to');
  if(salesRangeTo) salesRangeTo.addEventListener('change', ()=>{ state.admin.salesRangeTo = salesRangeTo.value; render(); });

  const stockSiteFilter = document.getElementById('stock-site-filter');
  if(stockSiteFilter) stockSiteFilter.addEventListener('change', ()=>{ state.admin.stockSite = stockSiteFilter.value || 'all'; render(); });

  const motMonth = document.getElementById('mot-month');

      if(quarterHourField && value!==''){

      const weekIso = iso(weekStartMonday(state.admin.tsWeek));

      const raw = inp.value.trim();

      if(!extras.employees[inp.dataset.hrsEmp].hoursOverride) extras.employees[inp.dataset.hrsEmp].hoursOverride = {};

      // If nothing actually changed, do nothing. Redrawing the table can make
      // the browser fire 'change' on the cell being removed, and without this
      // guard that saves again, redraws again, and loops forever.
      const previous = extras.employees[inp.dataset.hrsEmp].hoursOverride[inp.dataset.hrsDate];
      if(previous === storedValue) return;

      extras.employees[inp.dataset.hrsEmp].hoursOverride[inp.dataset.hrsDate] = storedValue;

      if(ok){

        // catch up when the week or site is changed, which avoids destroying
        // whatever the user is typing into next.
      } else {
        showToast('Not saved — check the connection.', true);
      }
    });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); inp.blur(); }
    });
  });

async function submitManagerLogin(){
  const emailEl = document.getElementById('mgr-email');
  const passEl = document.getElementById('mgr-password');
  const email = emailEl ? emailEl.value.trim() : '';
  const password = passEl ? passEl.value : '';
  state.admin.loginEmail = email;
  state.admin.error = '';
  if(!email || !password){
    state.admin.error = 'Enter your email and password.';
    render(); return;
  }
  state.admin.signingIn = true; render();
  try{
    const s = await signInManager(email, password);
    state.admin.authed = true;
    state.admin.role = s.role;
    state.admin.scopeSite = s.role==='site' ? s.siteId : null;
    state.admin.managerName = s.name || s.email;
    state.admin.signingIn = false;
    state.view = 'admin';
    // A new account can't do anything until its starting password is changed.
    state.admin.tab = s.mustChangePassword ? 'settings' : 'register';
    state.admin.forcePasswordChange = !!s.mustChangePassword;
    await loadAll();          // now signed in, pull the real data
    render();
  }catch(err){
    state.admin.signingIn = false;
    state.admin.error = (err && err.message) ? err.message : 'Could not sign in.';
    render();
  }
}

async function handlePinKey(key){
  const isAdmin = state.view==='admin-pin';
  const target = isAdmin ? state.admin : state.flow;
  if(key==='clear') target.pin='';
  else if(key==='back') target.pin = target.pin.slice(0,-1);
  else if(/^\d$/.test(key) && target.pin.length < 4) target.pin += key;
  target.error = '';

  // Staff PINs are four digits and continue as soon as the fourth is entered.
  // The check happens server-side — the staff list is no longer in the page.
  if(!isAdmin && target.pin.length===4){
    const entered = target.pin;
    target.pin=''; target.error='Checking…';
    render();
    try{
      const emp = await callRpc('staff_lookup', { p_pin: entered });
      if(emp && emp.id){
        target.employee = emp;
        target.verifiedPin = entered;   // kept only for this kiosk session
        target.error='';
        if(emp.mustChangePin){
          // They can't do anything else until they've chosen their own PIN.
          state.flow.forcedPinChange = true;
          state.view = 'change-pin';
        } else {
          state.flow.forcedPinChange = false;
          state.view = state.flow.mode==='clock' ? 'clock' : 'holiday';
        }
      } else {
        target.error='PIN not recognised';
      }
    }catch(err){
      target.error = 'Could not check PIN — ' + (err.message||'connection problem');
    }
  }
  render();
}

async function onAction(e){
  const action = e.currentTarget.dataset.action;
  const id = e.currentTarget.dataset.id;

  if(action==='start-clock'){ state.flow = {mode:'clock', pin:'', employee:null, error:''}; state.view='pin'; }
  else if(action==='start-holiday'){ state.flow = {mode:'holiday', pin:'', employee:null, error:''}; state.view='pin'; }
  else if(action==='go-home'){ state.view='home'; state.flow={mode:null,pin:'',employee:null,error:''}; }
  else if(action==='go-admin-pin'){ if(state.admin.authed && _session){ state.view='admin'; } else { state.admin.pin=''; state.admin.error=''; state.view='admin-pin'; } }
  else if(action==='submit-manager-login'){ await submitManagerLogin(); return; }
  else if(action==='retry-sites'){
    try{
      const sites = await callRpc('public_site_list', {});
      if(Array.isArray(sites) && sites.length) state.config.sites = sites;
      else showToast('No sites set up yet — a manager needs to add them.', true);
    }catch(err){
      showToast('Still cannot reach the server — ' + (err.message||''), true);
    }
    render(); return;
  }
  else if(action==='change-kiosk-site'){ state.view='kiosk-setup'; }
  else if(action==='go-privacy'){ state.view='privacy'; }
  else if(action==='save-kiosk-site'){
    const val = document.getElementById('kiosk-site-select').value;
    const ok = setKioskSite(val);
    if(ok){ state.view='home'; } else { showToast('Could not save on this device — check browser storage isn\'t blocked.', true); }
  }

  else if(action==='target-generate'){
    if(!requireSuper()) return render();
    const month=state.admin.targetMonth||new Date().toISOString().slice(0,7);
    const latest=await storageGet('targetSheets',{}), oldPlan=latest?.[month], sites={};
    try{
      for(const {site,key} of targetWorkshopSites()){
        const monthlyInput=document.querySelector(`[data-target-monthly="${site.id}"]`);
        const saturdayInput=document.querySelector(`[data-target-saturday="${site.id}"]`);
        const weekdayInput=document.querySelector(`[data-target-weekday="${site.id}"]`);
        const monthly=Number(monthlyInput?.value||0), saturday=site.noSaturday?0:Number(saturdayInput?.value||0), weekday=Number(weekdayInput?.value||0);
        if(!Number.isFinite(monthly)||monthly<=0) throw new Error(`${TARGET_SITE_DEFAULTS[key].label}: enter a monthly target.`);
        if(!Number.isFinite(saturday)||saturday<0) throw new Error(`${TARGET_SITE_DEFAULTS[key].label}: enter a valid Saturday target.`);
        if(!Number.isFinite(weekday)||weekday<=0) throw new Error(`${TARGET_SITE_DEFAULTS[key].label}: enter a normal weekday target.`);
        sites[site.id]=targetBuildSitePlan(month,site,key,monthly,saturday,oldPlan?.sites?.[site.id],weekday);
      }
    }catch(err){ showToast(err.message||'Could not calculate the target sheets.',true); return; }
    state.targetSheets=latest&&typeof latest==='object'&&!Array.isArray(latest)?latest:{};
    state.targetSheets[month]={month,roundTo:5,calculationVersion:2,sites,updatedAt:Date.now(),updatedBy:String(_session?.email||'')};
    if(await saveTargetSheets()) showToast('Monthly target sheets calculated and saved.');
    else showToast('The target sheets could not be saved.',true);
    render(); return;
  }
  else if(action==='target-save'){
    const month=state.admin.targetMonth||new Date().toISOString().slice(0,7), localPlan=targetMonthPlan(month);
    if(!localPlan){ showToast('Calculate this month’s target sheets first.',true); return; }
    const isSuper=state.admin.role==='super', scopeId=String(state.admin.scopeSite||'');
    if(!isSuper&&!localPlan.sites?.[scopeId]){ showToast('This target sheet is not assigned to your site.',true); return; }

    const actualUpdates=[];
    document.querySelectorAll('[data-target-actual-site][data-target-actual-date]').forEach(inp=>{
      const raw=String(inp.value||'').trim();
      actualUpdates.push({siteId:String(inp.dataset.targetActualSite),date:inp.dataset.targetActualDate,actual:raw===''?'':Math.max(0,Number(raw)||0)});
    });
    if(isSuper){
      document.querySelectorAll('[data-target-day-site][data-target-day-date]').forEach(inp=>{
        const sitePlan=localPlan.sites?.[inp.dataset.targetDaySite];
        const day=sitePlan?.days?.find(d=>d.date===inp.dataset.targetDayDate);
        if(day) day.target=targetRound(Math.max(0,Number(inp.value)||0),localPlan.roundTo||10);
      });
      for(const sitePlan of Object.values(localPlan.sites||{})){
        const dailyTotal=(sitePlan.days||[]).reduce((n,d)=>n+(Number(d.target)||0),0);
        if(Math.abs(dailyTotal-Number(sitePlan.monthlyTarget||0))>0.001){
          showToast(`${sitePlan.label}: daily targets total ${targetMoney(dailyTotal)}, not ${targetMoney(sitePlan.monthlyTarget)}. Adjust the days before saving.`,true);
          return;
        }
      }
    }
    const latest=await storageGet('targetSheets',{}), remotePlan=latest?.[month];
    if(!remotePlan){ showToast('This month’s target sheet is no longer available. Refresh and try again.',true); return; }
    if(isSuper){
      const entered=new Set(actualUpdates.map(x=>x.siteId+'|'+x.date));
      Object.entries(remotePlan.sites||{}).forEach(([siteId,remoteSite])=>{
        (remoteSite.days||[]).forEach(remoteDay=>{
          if(entered.has(String(siteId)+'|'+remoteDay.date)) return;
          const localDay=localPlan.sites?.[siteId]?.days?.find(d=>d.date===remoteDay.date);
          if(localDay) localDay.actual=remoteDay.actual;
        });
      });
      latest[month]=localPlan;
    }
    const savePlan=latest[month];
    actualUpdates.forEach(update=>{
      if(!isSuper&&update.siteId!==scopeId) return;
      const day=savePlan.sites?.[update.siteId]?.days?.find(d=>d.date===update.date);
      if(day&&day.open) day.actual=update.actual;
    });
    savePlan.updatedAt=Date.now(); savePlan.updatedBy=String(_session?.email||'');
    state.targetSheets=latest;
    if(await saveTargetSheets()) showToast('Target figures saved.');
    else showToast('The target figures could not be saved.',true);
    render(); return;
  }
  else if(action==='target-group-print'){
    if(state.admin.role!=='super'){ showToast('Group targets are for Upper Management.',true); return; }
    const month=state.admin.targetMonth||new Date().toISOString().slice(0,7);
    printSelectedReport('#target-group-output','Monthly Group Target '+month,'portrait'); return;
  }
  else if(action==='target-group-download'){
    if(state.admin.role!=='super'){ showToast('Group targets are for Upper Management.',true); return; }
    const month=state.admin.targetMonth||new Date().toISOString().slice(0,7);

  else if(action==='save-bonus'){

    draft.updatedAt=Date.now(); draft.updatedBy=String(_session.email||'');
    const [bonusOk,configOk]=await Promise.all([saveBonusSheets(),saveConfig()]);
    if(bonusOk&&configOk) showToast('Bonus Sheet saved.'); else showToast('Bonus Sheet could not be saved.',true);
    render(); return;

  else if(action==='toggle-saturday'){
    if(!requireSuper()) return render();
    const site = (state.config.sites||[]).find(s=>s.id===id);
    if(site){
      site.noSaturday = !site.noSaturday;
      await saveConfig();
      showToast(site.noSaturday ? siteName(id)+' now closed Saturdays.' : siteName(id)+' now open Saturdays.');
    }
  }
  else if(action==='toggle-trading-pattern'){
    if(!requireSuper()) return render();
    const site = state.config.sites.find(s=>s.id===id);
    if(site){
      site.tradingPattern = site.tradingPattern==='sevenDay' ? 'standard' : 'sevenDay';
      await saveConfig();
      showToast(site.tradingPattern==='sevenDay' ? 'Now open 7 days a week.' : 'Now closed Sundays & bank holidays.');
    }
  }

  else if(action==='add-bh'){
    if(!requireSuper()) return render();
    const val = document.getElementById('new-bh-date').value;
    if(val && !state.config.bankHolidays.includes(val)){
      state.config.bankHolidays.push(val);
      await saveConfig(); showToast('Bank holiday added.');
    }
  }
  else if(action==='remove-bh'){
    if(!requireSuper()) return render();
    const date = e.currentTarget.dataset.date;
    state.config.bankHolidays = state.config.bankHolidays.filter(d=>d!==date);
    await saveConfig(); showToast('Bank holiday removed.');
  }

  else if(action==='save-company-name'){
    if(!requireSuper()) return render();
    const v = document.getElementById('set-company-name').value.trim();
    if(v){ state.config.settings.companyName = v; await saveConfig(); showToast('Company name updated.'); }
  }
  else if(action==='toggle-clock-photos'){
    if(!requireSuper()) return render();
    const turningOn = !state.config.settings.clockPhotos;
    if(turningOn && !confirm('Turn on photo at clock-in?\n\nA photo will be taken each time someone clocks in or out. Staff must be told before this is switched on, and the privacy notice should say so.')) return;
    state.config.settings.clockPhotos = turningOn;
    const ok = await saveConfig();
    if(ok) showToast(turningOn ? 'Clock-in photos are now ON.' : 'Clock-in photos are now OFF.');
  }
  else if(action==='save-dp-settings'){
    if(!requireSuper()) return render();
    state.config.settings.dpContact = document.getElementById('set-dp-contact').value.trim();
    const years = parseInt(document.getElementById('set-dp-years').value,10);
    if(years>0) state.config.settings.dpRetentionYears = years;
    await saveConfig(); showToast('Data protection settings updated.');
  }
  else if(action==='save-hours'){
    if(!requireSuper()) return render();
    state.config.settings.weekdayStart = document.getElementById('set-weekday-start').value || '08:30';
    state.config.settings.weekdayEnd = document.getElementById('set-weekday-end').value || '17:30';
    state.config.settings.saturdayStart = document.getElementById('set-saturday-start').value || '08:30';
    state.config.settings.saturdayEnd = document.getElementById('set-saturday-end').value || '13:00';
    state.config.settings.sundayStart = document.getElementById('set-sunday-start').value || '08:00';
    state.config.settings.sundayEnd = document.getElementById('set-sunday-end').value || '20:00';
    await saveConfig(); showToast('Working hours updated.');
  }
  else if(action==='save-cap'){
    if(!requireSuper()) return render();
    const v = parseInt(document.getElementById('set-cap').value,10);
    if(v && v>0){ state.config.settings.capOff = v; await saveConfig(); showToast('Cap updated.'); }
  }
  else if(action==='save-accrual'){
    if(!requireSuper()) return render();
    const entitlement = parseInt(document.getElementById('set-default-entitlement').value,10);
    const rate = parseFloat(document.getElementById('set-accrual-rate').value);
    if(entitlement>0) state.config.settings.defaultAnnualEntitlement = entitlement;
    if(rate>0) state.config.settings.monthlyAccrualRate = rate;
    await saveConfig(); showToast('Accrual settings updated.');
  }
  else if(action==='save-admin-pin'){
    if(!requireSuper()) return render();
    const cur = document.getElementById('set-current-pin').value;
    const next = document.getElementById('set-new-pin').value;
    const errEl = document.getElementById('pin-change-error');
    if(cur !== state.config.settings.adminPin){ errEl.textContent='Current PIN is incorrect.'; return; }
    if(!/^\d{4}$/.test(next)){ errEl.textContent='New PIN must be exactly 4 digits.'; return; }
    const conflict = findPinConflict(next, null, null);
    if(conflict){ errEl.textContent='That PIN is already used by '+conflict+'.'; return; }
    state.config.settings.adminPin = next;
    await saveConfig(); showToast('Admin PIN changed.');
  }

  render();
}

/* ============================= INIT ============================= */
/* Keyboard support for PIN screens — number keys, numpad, Backspace and
   Escape all work the same as tapping the on-screen pad. Attached once to
   document since the pinpad buttons themselves get recreated every render. */
document.addEventListener('keydown', (e)=>{
  // Only the staff PIN pad, which has no text fields of its own. The manager
  // login and every other screen must be left alone or typing gets swallowed.
  if(state.view!=='pin') return;
  const t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable)) return;
  if(e.key>='0' && e.key<='9'){ e.preventDefault(); handlePinKey(e.key); }
  else if(e.key==='Backspace' || e.key==='Delete'){ e.preventDefault(); handlePinKey('back'); }
  else if(e.key==='Escape'){ e.preventDefault(); handlePinKey('clear'); }
});

async function init(){
  // Restore a manager session if one is still within its idle window.
  _session = loadSession();
  if(_session){
    state.admin.authed = true;
    state.admin.role = _session.role;
    state.admin.scopeSite = _session.role==='site' ? _session.siteId : null;
    state.admin.managerName = _session.name || _session.email;
  }
  // Every interaction pushes the idle timeout back an hour.
  ['click','keydown','touchstart'].forEach(evt=>{
    document.addEventListener(evt, ()=>{
      if(_session){
        if(sessionExpired()){
          clearSession();
          if(state.view==='admin'){
            state.admin.authed=false; state.admin.role=null; state.admin.scopeSite=null;
            state.admin.error='Signed out after an hour of inactivity.';
            state.view='admin-pin';
            try{ render(); }catch(_e){}
          }
        } else {
          touchSession();
        }
      }
    }, {passive:true});
  });

  // Show one stable startup screen until the initial data requests finish. Do
  // not briefly show kiosk setup: on a normal load that looked like a glitch.
  state.config = DEFAULT_CONFIG();
  state.view = 'loading';
  render();

  // Kiosks aren't signed in, so they can't read the private data table. Fetch
  // only the public site names. Loading the private table here used to replace
  // this successful result with an empty default config and show "Setting up".
  try{
    if(!(state.config.sites||[]).length){
      const sites = await callRpc('public_site_list', {});
      if(Array.isArray(sites) && sites.length) state.config.sites = sites;
    }
  }catch(_e){ /* offline: the screen will say so */ }

  try{
    // A restored manager session may load the full private dataset. A normal
    // public kiosk already has everything it needs from public_site_list.
    if(_session) await loadAll();
    const kioskSite = getKioskSite();
    state.view = (kioskSite && state.config.sites.find(s=>s.id===kioskSite)) ? 'home' : 'kiosk-setup';
    render();
  }catch(e){
    console.error('Shift Board startup failed:', e);
    // If the network really did fail, leave the branded loader and move to a
    // usable screen instead of spinning forever.
    state.config = state.config || DEFAULT_CONFIG();
    const kioskSite = getKioskSite();
    state.view = (kioskSite && state.config.sites.find(s=>s.id===kioskSite)) ? 'home' : 'kiosk-setup';
    render();
  }

  // Keep the Register current. Anyone leaving it open on a desk should be
  // able to trust it without remembering to reload the page.
  setInterval(async ()=>{
    if(state.view==='home'){ render(); }
    else if(state.view==='admin' && _session){
      try{
        const beforeRequests = holidayRequestsNeedingAttention().length;
        const rec = await jsonbinRead();
        if(rec.holidayRequests) state.requests = rec.holidayRequests;
        if(state.admin.tab==='register'){
          if(rec.clockEvents) state.events = rec.clockEvents;
          if(rec.absences) state.absences = rec.absences;
          if(rec.config) state.config = rec.config;
        }
        const viewingGroupTargets=state.admin.tab==='targets'&&state.admin.role==='super'&&(state.admin.targetSite||'all')==='all';
        if(viewingGroupTargets&&rec.targetSheets) state.targetSheets=rec.targetSheets;
        const viewingLiveSales=state.admin.tab==='sales'&&canViewWorkshopSales();
        if(viewingLiveSales&&(!state.admin.salesLoadedAt||Date.now()-state.admin.salesLoadedAt>=60000)){
          await loadSalesData(true);
        }
        const afterRequests = holidayRequestsNeedingAttention().length;
        state.admin.lastRefresh = Date.now();
        state.admin.refreshFailed = false;
        if(afterRequests>beforeRequests) showToast(`🔔 New holiday request received${afterRequests-beforeRequests>1?'s':''}.`);
        if(state.admin.tab==='register' || state.admin.tab==='requests' || viewingGroupTargets || viewingLiveSales || afterRequests!==beforeRequests) render();
      }catch(_e){
        state.admin.refreshFailed = true;
      }
    }
  }, 30000);

  // Also refresh the moment someone comes back to the tab, rather than making
  // them wait up to 30 seconds for stale figures to correct themselves.
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState !== 'visible') return;
    if(state.view==='admin' && _session){
      try{
        await loadAll();
        if(state.admin.tab==='sales'&&canViewWorkshopSales()) await loadSalesData(true);
        if(state.admin.tab==='stock'&&canViewPrivateTab('stock')) await loadStockData(true);
        if(state.admin.tab==='mot'&&canViewPrivateTab('mot')) await loadMotImports(true);
        state.admin.lastRefresh = Date.now();
        state.admin.refreshFailed = false;
        render();
      }catch(_e){}
    }
  });
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Shift Board service worker:', err));
  });
}
init();
</script>
